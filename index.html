<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASA ALTA | Cadastro de Empreendimentos V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--blue:#0a6ed1;--blue2:#e8f2fc;--nav:#243447;--green:#16845b;--amber:#a66b00;--red:#b42318;--shadow:0 6px 20px rgba(15,23,42,.08);font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#login{position:relative;z-index:100;pointer-events:auto;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f8,#e7edf5)}.login-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:34px}.brand{font-weight:800;letter-spacing:.08em;color:#17324d;font-size:20px}.login-card h1{font-size:28px;margin:14px 0 8px}.subtitle{color:var(--muted);margin-bottom:26px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:12px;font-weight:700;color:#475467;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea{position:relative;z-index:2;pointer-events:auto;border:1px solid #cfd6df;border-radius:8px;padding:11px 12px;background:#fff}.field textarea{min-height:84px;resize:vertical}.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700}.secondary{background:#fff;color:#344054;border:1px solid #cfd6df;border-radius:8px;padding:10px 14px}.danger{background:#fff;color:var(--red);border:1px solid #f0c5c2;border-radius:8px;padding:9px 13px}.link{background:none;border:0;color:var(--blue);padding:0}.error{color:var(--red);font-size:13px;margin-top:10px}
.app{display:none;min-height:100vh}.app.ready{display:block}.topbar{height:58px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar .brand{color:#fff}.userbox{display:flex;gap:12px;align-items:center;font-size:13px}.userbox button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px}.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}.sidebar{background:#2d3d50;color:#d9e2ec;padding:14px 0}.menu-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#97a6b6;padding:10px 18px}.nav{display:flex;flex-direction:column}.nav button{border:0;background:none;color:#d9e2ec;text-align:left;padding:11px 18px}.nav button.active,.nav button:hover{background:#1f5f95;color:#fff}.context{margin:14px;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:12px;background:rgba(0,0,0,.08)}.context .small{font-size:11px;color:#aeb9c5}.context strong{display:block;margin-top:5px;font-size:13px;line-height:1.3}.change{margin-top:10px;width:100%;padding:7px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff}
main{padding:20px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}.toolbar h2{margin:0;font-size:20px}.crumb{font-size:12px;color:var(--muted);margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.03)}.kpi{padding:16px}.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase}.kpi .value{font-size:28px;font-weight:800;margin-top:7px}.kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:14px;padding:16px}.section h3{margin:0 0 12px;font-size:15px}.chartbar{height:10px;background:#edf0f3;border-radius:20px;overflow:hidden}.chartbar>span{display:block;height:100%;background:var(--blue);border-radius:20px}.mix-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:10px 0;font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#f7f8fa;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.03em;text-align:left;position:sticky;top:0}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table tr:hover td{background:#fafcff}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.s-success{background:#e8f7ef;color:var(--green)}.s-warning{background:#fff6db;color:var(--amber)}.s-neutral{background:#eef1f5;color:#596574}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:12px}.filters input,.filters select{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(720px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.22)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail{padding:11px;background:#f8fafc;border-radius:8px}.detail span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}.detail strong{display:block;margin-top:4px}
.select-screen{padding:28px}.select-header{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:18px}.select-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.emp-card{padding:16px;border:1px solid var(--line);background:#fff;border-radius:10px;box-shadow:0 2px 5px rgba(15,23,42,.04);cursor:pointer}.emp-card:hover{border-color:#9cc4e7;box-shadow:var(--shadow)}.emp-card h3{margin:0 0 6px;font-size:16px}.emp-meta{font-size:12px;color:var(--muted);line-height:1.5}.emp-card .open{margin-top:12px;width:100%}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.select-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(max-width:620px){.grid{grid-template-columns:1fr}.select-grid{grid-template-columns:1fr}.formgrid,.detail-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.topbar{padding:0 10px}.userbox span{display:none}main{padding:12px}.toolbar{align-items:flex-start;flex-direction:column}}
.report-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.report-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.chart-box{height:290px;position:relative}.chart-box.tall{height:340px}.report-filter-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px}.report-filter-grid input,.report-filter-grid select{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}.toolbar .context-actions{display:flex;gap:8px;flex-wrap:wrap}.nav-sep{height:1px;background:rgba(255,255,255,.10);margin:8px 18px}.stat-note{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}@media(max-width:1100px){.report-grid,.report-grid-3{grid-template-columns:1fr}.report-filter-grid{grid-template-columns:1fr 1fr}.report-filter-grid input{grid-column:1/-1}}@media print{.sidebar,.topbar,.actions,.filters,.report-filter-grid{display:none!important}main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<section id="login"><div class="login-card"><div class="brand">CASA ALTA</div><h1>Cadastro de Empreendimentos</h1><div class="subtitle">Acesso restrito à equipe. Dados centralizados no Supabase.</div><form id="loginForm"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Entrar</button><div id="loginError" class="error hidden"></div></form></div></section>
<div id="app" class="app">
<header class="topbar"><div class="brand">CASA ALTA • MASTER DATA</div><div class="userbox"><span id="userEmail"></span><button id="signOut">Sair</button></div></header>
<div class="shell">
<aside class="sidebar"><div id="contextBox" class="context hidden"><div class="small">Empreendimento selecionado</div><strong id="contextName"></strong><button class="change" id="changeEmp">Trocar empreendimento</button></div><div class="menu-title">Visão corporativa</div><nav class="nav"><button data-view="consolidado">Todos os empreendimentos</button><button data-view="relatorios-geral">Relatório executivo</button></nav><div class="nav-sep"></div><div class="menu-title">Empreendimento selecionado</div><nav class="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="unidades">Unidades</button><button data-view="relatorios">Relatórios</button></nav><div class="nav-sep"></div><nav class="nav"><button data-action="novo-emp">+ Cadastrar empreendimento</button><button data-action="trocar">Trocar empreendimento</button></nav></aside>
<main id="main"></main>
</div></div>
<div id="modal" class="modal hidden"></div>
<script src="config.js"></script>
<script>
let sb=null;
const state={user:null,empreendimentos:[],selected:null,unidades:[],vendas:[],owners:[],view:'dashboard',filters:{q:'',tipo:'',sfh:''}};
const $=id=>document.getElementById(id); const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showLoginError(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')}
function setReady(){ $('login').classList.add('hidden'); $('app').classList.add('ready'); $('userEmail').textContent=state.user?.email||''; }
function setupSupabase(){
  try {
    const cfg=window.APP_CONFIG||{};
    if(!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('SEU-PROJETO') || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_ANON_KEY.includes('SUA_CHAVE')) {
      showLoginError('O arquivo config.js ainda não está configurado com a URL e a chave pública do Supabase.');
      return false;
    }
    if(!window.supabase || typeof window.supabase.createClient!=='function'){
      showLoginError('A biblioteca do Supabase não carregou. Verifique sua conexão com a internet e recarregue a página.');
      return false;
    }
    sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    return true;
  } catch(err) {
    console.error(err);
    showLoginError('Não foi possível inicializar o Supabase. Abra o console do navegador para o diagnóstico.');
    return false;
  }
}
async function init(){
  if(!setupSupabase()) return;
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(error) throw error;
    if(session){state.user=session.user;setReady();await loadEmpreendimentos()}
    sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;if(!state.user){$('app').classList.remove('ready');$('login').classList.remove('hidden');$('userEmail').textContent='';}});
  }catch(err){ console.error(err); showLoginError('Conexão com o Supabase falhou: '+(err.message||err)); }
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginError').classList.add('hidden');
  if(!sb){showLoginError('O Supabase não está configurado.');return}
  const button=e.target.querySelector('button'); button.disabled=true; button.textContent='Entrando…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});
    if(error) return showLoginError(error.message);
    state.user=data.user;setReady();await loadEmpreendimentos();
  }catch(err){console.error(err);showLoginError('Erro ao entrar: '+(err.message||err));}
  finally{button.disabled=false;button.textContent='Entrar';}
});
$('signOut').onclick=async()=>{await sb.auth.signOut()};
async function loadEmpreendimentos(){const {data,error}=await sb.from('empreendimentos').select('*').order('nome'); if(error){alert(error.message);return} state.empreendimentos=data||[]; renderSelector()}
function renderSelector(){state.selected=null;$('contextBox').classList.add('hidden');main().innerHTML=`<div class="select-screen"><div class="select-header"><div><div class="crumb">CASA ALTA / CONTEXTO</div><h2 style="margin:0">Selecione um empreendimento</h2><div class="muted" style="margin-top:5px">O sistema só carrega unidades, proprietários e vendas depois desta seleção.</div></div><button class="secondary" onclick="loadEmpreendimentos()">Atualizar</button></div><div class="select-grid">${state.empreendimentos.map(e=>`<div class="emp-card" onclick="selectEmp('${e.id}')"><h3>${esc(e.nome)}</h3><div class="emp-meta">${esc(e.cidade||'Cidade não informada')}<br>Status: ${esc(e.status)}</div><button class="primary open" onclick="event.stopPropagation();selectEmp('${e.id}')">Abrir empreendimento</button></div>`).join('')}</div></div>`}
async function selectEmp(id){state.selected=state.empreendimentos.find(x=>x.id===id); if(!state.selected)return; $('contextBox').classList.remove('hidden');$('contextName').textContent=state.selected.nome; await loadContext(); nav('dashboard')}
$('changeEmp').onclick=()=>renderSelector();
async function loadContext(){const e=state.selected; const [u,v,p]=await Promise.all([sb.from('unidades').select('*').eq('empreendimento_id',e.id).order('codigo'),sb.from('vendas').select('*').eq('empreendimento_id',e.id),sb.from('proprietarios').select('*')]); if(u.error||v.error||p.error){alert((u.error||v.error||p.error).message);return} state.unidades=u.data||[]; state.vendas=v.data||[]; state.owners=p.data||[]}
function main(){return $('main')}
function nav(view){if(!state.selected){return renderSelector()}state.view=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); ({dashboard:renderDashboard,unidades:renderUnidades,relatorios:renderRelatorios}[view])()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function metrics(){const total=state.unidades.length;const vendas=state.vendas.length;const sfh=state.vendas.filter(v=>v.tipo_venda.toLowerCase()==='sfh').length;const sem=state.vendas.filter(v=>!v.data_sfh).length;const clientes=new Set(state.vendas.map(v=>v.proprietario_id).filter(Boolean)).size;return {total,vendas,sfh,sem,clientes};}
function renderDashboard(){const m=metrics();const byType={};state.vendas.forEach(v=>byType[v.tipo_venda]=(byType[v.tipo_venda]||0)+1);const rows=Object.entries(byType).sort((a,b)=>b[1]-a[1]);const sfhPct=m.vendas?Math.round(m.sfh/m.vendas*100):0;const filledPct=m.vendas?Math.round((m.vendas-m.sem)/m.vendas*100):0;main().innerHTML=`<div class="toolbar"><div><div class="crumb">Empreendimento / Dashboard</div><h2>${esc(state.selected.nome)}</h2><div class="muted">Visão executiva do cadastro selecionado</div></div><div class="actions"><button class="secondary" onclick="exportCsv()">Exportar CSV</button><button class="primary" onclick="openUnitModal()">+ Nova unidade / venda</button></div></div><div class="grid"><div class="card kpi"><div class="label">Unidades</div><div class="value">${m.total}</div><div class="hint">Base cadastral do empreendimento</div></div><div class="card kpi"><div class="label">Vendas</div><div class="value">${m.vendas}</div><div class="hint">Unidade com cadastro de venda</div></div><div class="card kpi"><div class="label">SFH</div><div class="value">${sfhPct}%</div><div class="hint">${m.sfh} registros classificados como SFH</div></div><div class="card kpi"><div class="label">Cadastro completo</div><div class="value">${filledPct}%</div><div class="hint">Data SFH preenchida</div></div></div><div class="card section"><h3>Composição por tipo de venda</h3>${rows.length?rows.map(([k,n])=>`<div class="mix-row"><div>${esc(k)}</div><div class="chartbar"><span style="width:${m.vendas?Math.round(n/m.vendas*100):0}%"></span></div><div style="text-align:right;font-weight:700">${n}</div></div>`).join(''):'<div class="empty">Sem vendas cadastradas.</div>'}</div><div class="card section"><h3>Alertas cadastrais</h3><div class="detail-grid"><div class="detail"><span>Sem Data SFH</span><strong>${m.sem}</strong></div><div class="detail"><span>Clientes distintos</span><strong>${m.clientes}</strong></div></div></div>`}
function filtered(){const q=state.filters.q.toLowerCase();return state.vendas.map(v=>{const u=state.unidades.find(x=>x.id===v.unidade_id)||{};const p=state.owners.find(x=>x.id===v.proprietario_id)||{};return {...v,u,p}}).filter(x=>!q||`${x.u.codigo} ${x.p.nome||''}`.toLowerCase().includes(q)).filter(x=>!state.filters.tipo||x.tipo_venda===state.filters.tipo).filter(x=>state.filters.sfh!==''?(state.filters.sfh==='com'?!!x.data_sfh:!x.data_sfh):true)}
function renderUnidades(){const data=filtered();const tipos=[...new Set(state.vendas.map(v=>v.tipo_venda))].sort();main().innerHTML=`<div class="toolbar"><div><div class="crumb">Empreendimento / Unidades</div><h2>Unidades e vendas</h2></div><div class="actions"><button class="secondary" onclick="exportCsv()">Exportar CSV</button><button class="primary" onclick="openUnitModal()">+ Novo cadastro</button></div></div><div class="card section"><div class="filters"><input placeholder="Buscar unidade ou proprietário..." value="${esc(state.filters.q)}" oninput="state.filters.q=this.value;renderUnidades()"><select onchange="state.filters.tipo=this.value;renderUnidades()"><option value="">Todos os tipos</option>${tipos.map(t=>`<option ${state.filters.tipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select onchange="state.filters.sfh=this.value;renderUnidades()"><option value="">Data SFH — todos</option><option value="com" ${state.filters.sfh==='com'?'selected':''}>Com Data SFH</option><option value="sem" ${state.filters.sfh==='sem'?'selected':''}>Sem Data SFH</option></select><button class="secondary" onclick="state.filters={q:'',tipo:'',sfh:''};renderUnidades()">Limpar</button><div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Unidade</th><th>Proprietário</th><th>Data SFH</th><th>Tipo</th><th>Status</th><th></th></tr></thead><tbody>${data.map(x=>`<tr><td><strong>${esc(x.u.codigo)}</strong></td><td>${esc(x.p.nome||'—')}</td><td>${fmtDate(x.data_sfh)}</td><td><span class="status ${x.tipo_venda==='SFH'?'s-success':'s-neutral'}">${esc(x.tipo_venda)}</span></td><td>${x.status}</td><td><button class="secondary" onclick="openUnitModal('${x.u.id}')">Editar</button></td></tr>`).join('')}</tbody></table>${data.length?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div></div>`}
function renderRelatorios(){const m=metrics();const years={};state.vendas.forEach(v=>{if(v.data_sfh){const y=v.data_sfh.slice(0,4);years[y]=(years[y]||0)+1}});const yearsRows=Object.entries(years).sort();main().innerHTML=`<div class="toolbar"><div><div class="crumb">Empreendimento / Relatórios</div><h2>Relatórios gerenciais</h2><div class="muted">Indicadores calculados somente para ${esc(state.selected.nome)}</div></div></div><div class="grid"><div class="card kpi"><div class="label">Cobertura SFH</div><div class="value">${m.vendas?Math.round(m.sfh/m.vendas*100):0}%</div><div class="hint">SFH / registros de venda</div></div><div class="card kpi"><div class="label">Pendências</div><div class="value">${m.sem}</div><div class="hint">Sem Data SFH</div></div><div class="card kpi"><div class="label">Proprietários</div><div class="value">${m.clientes}</div><div class="hint">Clientes distintos associados</div></div><div class="card kpi"><div class="label">Cobertura cadastral</div><div class="value">${m.total?Math.round(m.vendas/m.total*100):0}%</div><div class="hint">Unidades com venda</div></div></div><div class="card section"><h3>Distribuição de Datas SFH por ano</h3>${yearsRows.length?yearsRows.map(([y,n])=>`<div class="mix-row"><div>${y}</div><div class="chartbar"><span style="width:${m.sfh?Math.round(n/m.sfh*100):0}%"></span></div><div style="text-align:right;font-weight:700">${n}</div></div>`).join(''):'<div class="empty">Não há Datas SFH preenchidas.</div>'}</div><div class="card section"><h3>Qualidade do cadastro</h3><div class="detail-grid"><div class="detail"><span>Com Data SFH</span><strong>${m.vendas-m.sem}</strong></div><div class="detail"><span>Sem Data SFH</span><strong>${m.sem}</strong></div></div></div>`}
function openUnitModal(unitId){const u=state.unidades.find(x=>x.id===unitId);const v=state.vendas.find(x=>x.unidade_id===unitId);const p=v?.proprietario_id; $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><strong>${u?'Editar cadastro':'Novo cadastro'}</strong><button class="secondary" onclick="closeModal()">Fechar</button></div><form id="unitForm"><div class="modal-body"><div class="formgrid"><div class="field"><label>Unidade</label><input name="codigo" required value="${esc(u?.codigo||'')}"></div><div class="field"><label>Proprietário</label><input name="cliente" required value="${esc((state.owners.find(x=>x.id===p)||{}).nome||'')}"></div><div class="field"><label>Data SFH</label><input name="data_sfh" type="date" value="${esc(v?.data_sfh||'')}"></div><div class="field"><label>Tipo de venda</label><select name="tipo_venda"><option ${!v||v.tipo_venda==='SFH'?'selected':''}>SFH</option><option ${v?.tipo_venda==='Venda Direta'?'selected':''}>Venda Direta</option><option ${v?.tipo_venda==='Outro'?'selected':''}>Outro</option></select></div><div class="field span2"><label>Observações</label><textarea name="observacoes">${esc(v?.observacoes||'')}</textarea></div></div></div><div class="modal-actions">${u?'<button type="button" class="danger" onclick="deleteUnit(\''+u.id+'\')">Excluir</button>':''}<span style="flex:1"></span><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div></form></div>`;$('unitForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await saveUnit(u,v,f)}}
async function saveUnit(u,v,f){const codigo=f.get('codigo').trim(),cliente=f.get('cliente').trim();let owner=state.owners.find(x=>x.nome.trim().toLowerCase()===cliente.toLowerCase());if(!owner){const r=await sb.from('proprietarios').insert({nome:cliente}).select().single();if(r.error)return alert(r.error.message);owner=r.data}else if(owner.nome!==cliente){await sb.from('proprietarios').update({nome:cliente}).eq('id',owner.id)}let unit;if(u){unit=(await sb.from('unidades').update({codigo}).eq('id',u.id).select().single()).data}else{const r=await sb.from('unidades').insert({empreendimento_id:state.selected.id,codigo}).select().single();if(r.error)return alert(r.error.message);unit=r.data}const payload={empreendimento_id:state.selected.id,unidade_id:unit.id,proprietario_id:owner.id,data_sfh:f.get('data_sfh')||null,tipo_venda:f.get('tipo_venda'),observacoes:f.get('observacoes')||null};let r;if(v)r=await sb.from('vendas').update(payload).eq('id',v.id);else r=await sb.from('vendas').insert(payload);if(r.error)return alert(r.error.message);closeModal();await loadContext();nav(state.view)}
async function deleteUnit(id){if(!confirm('Excluir a unidade e o cadastro de venda?'))return;const {error}=await sb.from('unidades').delete().eq('id',id);if(error)return alert(error.message);closeModal();await loadContext();nav('unidades')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function exportCsv(){const data=filtered();const header=['Empreendimento','Unidade','Proprietário','Data SFH','Tipo de Venda','Status'];const lines=[header,...data.map(x=>[state.selected.nome,x.u.codigo,x.p.nome||'',x.data_sfh||'',x.tipo_venda||'',x.status||''])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.selected.nome.replace(/\s+/g,'_')}_cadastro.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('DOMContentLoaded',init);
// V4 enhancements: consolidated view, enterprise master-data CRUD and executive analytics.
const v4charts={};
function v4destroyCharts(){Object.values(v4charts).forEach(c=>{try{c.destroy()}catch(e){}});Object.keys(v4charts).forEach(k=>delete v4charts[k]);}
function v4norm(s){return String(s??'').trim().toLowerCase();}
function v4count(arr,keyFn){return arr.reduce((o,x)=>{const k=keyFn(x)||'Não informado';o[k]=(o[k]||0)+1;return o;},{});}
function v4downloadCsv(header,rows,name){const lines=[header,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function v4LoadAllData(){
  const [u,v,p]=await Promise.all([sb.from('unidades').select('*'),sb.from('vendas').select('*'),sb.from('proprietarios').select('*')]);
  if(u.error||v.error||p.error){alert((u.error||v.error||p.error).message);return false}
  state._allUnits={}; state._allVendas={}; state._allOwners={};
  (u.data||[]).forEach(x=>(state._allUnits[x.empreendimento_id]??=[]).push(x));
  (v.data||[]).forEach(x=>(state._allVendas[x.empreendimento_id]??=[]).push(x));
  (p.data||[]).forEach(x=>state._allOwners[x.id]=x);
  return true;
}
function v4empMetrics(eid){const us=state._allUnits?.[eid]||[],vs=state._allVendas?.[eid]||[];const sfh=vs.filter(v=>v4norm(v.tipo_venda)==='sfh').length;const sem=vs.filter(v=>!v.data_sfh).length;return{u:us.length,v:vs.length,sfh,sem,complete:vs.length?Math.round((vs.length-sem)/vs.length*100):0,coverage:us.length?Math.round(vs.length/us.length*100):0};}
function v4chart(id,type,labels,data,label){if(!window.Chart||!$(id))return;v4charts[id]=new Chart($(id),{type,data:{labels,datasets:[{label,data,borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type!=='bar'}} ,scales:type==='bar'?{y:{beginAtZero:true}}:undefined}})}
function v4donut(id,labels,data){if(!window.Chart||!$(id))return;v4charts[id]=new Chart($(id),{type:'doughnut',data:{labels,datasets:[{data}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}})}
function v4renderConsolidado(){
  v4destroyCharts();
  const list=state.empreendimentos.map(e=>({e,m:v4empMetrics(e.id)}));
  const q=v4norm(state.globalQ||'');
  const filtered=list.filter(x=>!q||v4norm(x.e.nome).includes(q)||v4norm(x.e.cidade).includes(q));
  const totals=filtered.reduce((a,x)=>{a.u+=x.m.u;a.v+=x.m.v;a.sfh+=x.m.sfh;a.sem+=x.m.sem;return a},{u:0,v:0,sfh:0,sem:0});
  main().innerHTML=`<div class="toolbar"><div><div class="crumb">CASA ALTA / VISÃO CORPORATIVA</div><h2>Todos os empreendimentos</h2><div class="muted">Visão agregada de portfólio. Os dados operacionais continuam segregados por empreendimento.</div></div><div class="actions"><button class="secondary" onclick="openEmpModal()">+ Cadastrar empreendimento</button><button class="secondary" onclick="v4exportPortfolio()">Exportar visão</button></div></div>
  <div class="card section"><div class="filters"><input placeholder="Pesquisar empreendimento ou cidade..." value="${esc(state.globalQ||'')}" oninput="state.globalQ=this.value;v4renderConsolidado()"><button class="secondary" onclick="state.globalQ='';v4renderConsolidado()">Limpar</button></div></div>
  <div class="grid">${kpi('Empreendimentos',filtered.length,'Total na visão atual')}${kpi('Unidades',totals.u,'Portfólio consolidado')}${kpi('Vendas',totals.v,'Registros de venda')}${kpi('Cobertura SFH',totals.v?Math.round(totals.sfh/totals.v*100)+'%':'0%',`${totals.sfh} SFH`)}</div>
  <div class="report-grid"><div class="card section"><h3>Volume de unidades por empreendimento</h3><div class="chart-box"><canvas id="v4EmpUnits"></canvas></div></div><div class="card section"><h3>Completude cadastral</h3><div class="chart-box"><canvas id="v4EmpComplete"></canvas></div></div></div>
  <div class="card section"><h3>Mapa executivo do portfólio</h3><div class="table-wrap"><table class="table"><thead><tr><th>Empreendimento</th><th>Cidade</th><th>Status</th><th>Unidades</th><th>Vendas</th><th>SFH</th><th>Pendências</th><th>Completude</th><th></th></tr></thead><tbody>${filtered.map(x=>`<tr><td><strong>${esc(x.e.nome)}</strong></td><td>${esc(x.e.cidade||'—')}</td><td><span class="status ${x.e.status==='Ativo'?'s-success':'s-neutral'}">${esc(x.e.status||'Ativo')}</span></td><td>${x.m.u}</td><td>${x.m.v}</td><td>${x.m.sfh}</td><td>${x.m.sem}</td><td><span class="status ${x.m.complete>=90?'s-success':x.m.complete>=70?'s-warning':'s-neutral'}">${x.m.complete}%</span></td><td><button class="secondary" onclick="selectEmp('${x.e.id}')">Abrir</button></td></tr>`).join('')}</tbody></table></div></div>`;
  setTimeout(()=>{const labs=filtered.map(x=>x.e.nome);v4chart('v4EmpUnits','bar',labs,filtered.map(x=>x.m.u),'Unidades');v4chart('v4EmpComplete','bar',labs,filtered.map(x=>x.m.complete),'Completude %')},0);
}
async function v4showConsolidado(){if(!state._allUnits)await v4LoadAllData();v4renderConsolidado();}
async function v4showRelatorioGeral(){if(!state._allUnits)await v4LoadAllData();v4destroyCharts();
  const all=[];Object.values(state._allVendas||{}).forEach(a=>all.push(...a));
  let rows=all;
  const gf=state.globalFilters||{};
  if(gf.emp)rows=rows.filter(v=>v.empreendimento_id===gf.emp);
  if(gf.tipo)rows=rows.filter(v=>v.tipo_venda===gf.tipo);
  if(gf.ano)rows=rows.filter(v=>v.data_sfh?.startsWith(gf.ano));
  if(gf.completude==='com')rows=rows.filter(v=>!!v.data_sfh);
  if(gf.completude==='sem')rows=rows.filter(v=>!v.data_sfh);
  if(gf.q){const q=v4norm(gf.q);rows=rows.filter(v=>{const u=(state._allUnits[v.empreendimento_id]||[]).find(x=>x.id===v.unidade_id);const p=state._allOwners[v.proprietario_id];const e=state.empreendimentos.find(x=>x.id===v.empreendimento_id);return v4norm(`${u?.codigo||''} ${p?.nome||''} ${e?.nome||''}`).includes(q)})}
  const types=v4count(rows,v=>v.tipo_venda),years=v4count(rows,v=>v.data_sfh?v.data_sfh.slice(0,4):'Sem data'),emp=v4count(rows,v=>v.empreendimento_id),complete=rows.filter(v=>!!v.data_sfh).length,pend=rows.length-complete;
  const empOptions=state.empreendimentos.map(e=>`<option value="${e.id}" ${gf.emp===e.id?'selected':''}>${esc(e.nome)}</option>`).join('');
  const typeOptions=Object.keys(v4count(all,v=>v.tipo_venda)).sort().map(t=>`<option ${gf.tipo===t?'selected':''}>${esc(t)}</option>`).join('');
  const yearOptions=Object.keys(v4count(all,v=>v.data_sfh?v.data_sfh.slice(0,4):'Sem data')).filter(y=>y!=='Sem data').sort().map(y=>`<option ${gf.ano===y?'selected':''}>${y}</option>`).join('');
  const empRank=Object.entries(emp).sort((a,b)=>b[1]-a[1]).slice(0,10);
  main().innerHTML=`<div class="toolbar"><div><div class="crumb">CASA ALTA / RELATÓRIO EXECUTIVO</div><h2>Relatório executivo consolidado</h2><div class="muted">Análise de portfólio com filtros cruzados.</div></div><div class="actions"><button class="secondary" onclick="window.print()">Imprimir</button><button class="secondary" onclick="v4exportReport()">Exportar CSV</button></div></div>
  <div class="card section"><div class="report-filter-grid"><input placeholder="Empreendimento, unidade ou proprietário..." value="${esc(gf.q||'')}" oninput="state.globalFilters.q=this.value;v4showRelatorioGeral()"><select onchange="state.globalFilters.emp=this.value;v4showRelatorioGeral()"><option value="">Todos os empreendimentos</option>${empOptions}</select><select onchange="state.globalFilters.tipo=this.value;v4showRelatorioGeral()"><option value="">Todos os tipos</option>${typeOptions}</select><select onchange="state.globalFilters.ano=this.value;v4showRelatorioGeral()"><option value="">Todos os anos</option>${yearOptions}</select><select onchange="state.globalFilters.completude=this.value;v4showRelatorioGeral()"><option value="">Completude — todos</option><option value="com" ${gf.completude==='com'?'selected':''}>Com Data SFH</option><option value="sem" ${gf.completude==='sem'?'selected':''}>Sem Data SFH</option></select><button class="secondary" onclick="state.globalFilters={q:'',emp:'',tipo:'',ano:'',completude:''};v4showRelatorioGeral()">Limpar</button></div></div>
  <div class="grid">${kpi('Registros filtrados',rows.length,'Universo analítico atual')}${kpi('Com Data SFH',complete,rows.length?Math.round(complete/rows.length*100)+'% do universo':'0%')}${kpi('Pendências',pend,'Sem Data SFH')}${kpi('Tipos de venda',Object.keys(types).length,'Categorias no filtro')}</div>
  <div class="report-grid"><div class="card section"><h3>Mix de vendas</h3><div class="chart-box"><canvas id="v4Type"></canvas></div></div><div class="card section"><h3>SFH por ano</h3><div class="chart-box"><canvas id="v4Year"></canvas></div></div></div>
  <div class="report-grid-3"><div class="card section"><h3>Ranking por empreendimento</h3><div class="chart-box tall"><canvas id="v4Rank"></canvas></div></div><div class="card section"><h3>Qualidade do cadastro</h3><div class="chart-box"><canvas id="v4Qual"></canvas></div></div><div class="card section"><h3>Indicadores executivos</h3><div class="stat-note"><span>Empreendimentos</span><strong>${state.empreendimentos.length}</strong></div><div class="stat-note"><span>Unidades no portfólio</span><strong>${Object.values(state._allUnits).flat().length}</strong></div><div class="stat-note"><span>Vendas no portfólio</span><strong>${all.length}</strong></div><div class="stat-note"><span>Pendências totais</span><strong>${all.filter(v=>!v.data_sfh).length}</strong></div></div></div>`;
  setTimeout(()=>{v4donut('v4Type',Object.keys(types),Object.values(types));v4chart('v4Year','bar',Object.keys(years).sort(),Object.keys(years).sort().map(k=>years[k]),'Registros');v4chart('v4Rank','bar',empRank.map(([id])=>state.empreendimentos.find(e=>e.id===id)?.nome||id),empRank.map(x=>x[1]),'Vendas');v4donut('v4Qual',['Com Data SFH','Sem Data SFH'],[complete,pend])},0)
}
function v4exportPortfolio(){const rows=state.empreendimentos.map(e=>{const m=v4empMetrics(e.id);return[e.nome,e.cidade||'',e.status||'',m.u,m.v,m.sfh,m.sem,m.complete+'%']});v4downloadCsv(['Empreendimento','Cidade','Status','Unidades','Vendas','SFH','Sem Data SFH','Completude'],rows,'portfolio_empreendimentos.csv')}
async function v4exportReport(){if(!state._allUnits)await v4LoadAllData();const all=[];Object.values(state._allVendas||{}).forEach(a=>all.push(...a));const rows=all.map(v=>{const e=state.empreendimentos.find(x=>x.id===v.empreendimento_id);const u=(state._allUnits[v.empreendimento_id]||[]).find(x=>x.id===v.unidade_id);const p=state._allOwners[v.proprietario_id];return[e?.nome||'',u?.codigo||'',p?.nome||'',v.data_sfh||'',v.tipo_venda||'',v.status||'']});v4downloadCsv(['Empreendimento','Unidade','Proprietário','Data SFH','Tipo de Venda','Status'],rows,'relatorio_executivo.csv')}
function openEmpModal(empId){const e=state.empreendimentos.find(x=>x.id===empId);$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><strong>${e?'Editar empreendimento':'Cadastrar empreendimento'}</strong><button class="secondary" onclick="closeModal()">Fechar</button></div><form id="empForm"><div class="modal-body"><div class="formgrid"><div class="field"><label>Nome do empreendimento *</label><input name="nome" required value="${esc(e?.nome||'')}"></div><div class="field"><label>Status *</label><select name="status"><option ${!e||e.status==='Ativo'?'selected':''}>Ativo</option><option ${e?.status==='Inativo'?'selected':''}>Inativo</option></select></div><div class="field"><label>Cidade</label><input name="cidade" value="${esc(e?.cidade||'')}"></div><div class="field"><label>Construtora</label><input name="construtora" value="${esc(e?.construtora||'')}"></div><div class="field span2"><label>Endereço</label><input name="endereco" value="${esc(e?.endereco||'')}"></div></div></div><div class="modal-actions">${e?`<button type="button" class="danger" onclick="deleteEmp('${e.id}')">Excluir</button>`:''}<span style="flex:1"></span><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar empreendimento</button></div></form></div>`;$('empForm').onsubmit=async ev=>{ev.preventDefault();await saveEmp(e,new FormData(ev.target))}}
async function saveEmp(e,f){const payload={nome:String(f.get('nome')||'').trim(),status:f.get('status'),cidade:String(f.get('cidade')||'').trim()||null,construtora:String(f.get('construtora')||'').trim()||null,endereco:String(f.get('endereco')||'').trim()||null};if(!payload.nome)return;const r=e?await sb.from('empreendimentos').update(payload).eq('id',e.id):await sb.from('empreendimentos').insert(payload).select().single();if(r.error){alert(r.error.message);return}closeModal();state._allUnits=null;state._allVendas=null;state._allOwners=null;await loadEmpreendimentos();if(!e){const created=state.empreendimentos.find(x=>v4norm(x.nome)===v4norm(payload.nome));if(created)await selectEmp(created.id)}else if(state.selected?.id===e.id){state.selected=state.empreendimentos.find(x=>x.id===e.id);if(state.selected){await loadContext();nav(state.view)}}}
async function deleteEmp(id){if(!confirm('Excluir este empreendimento? Unidades e vendas vinculadas também serão excluídas.'))return;const {error}=await sb.from('empreendimentos').delete().eq('id',id);if(error){alert(error.message);return}closeModal();state.selected=null;state._allUnits=null;state._allVendas=null;state._allOwners=null;await loadEmpreendimentos()}
// Override navigation after original V3 declaration.
const v4OriginalNav=nav;
nav=function(view){if(view==='consolidado'){state.view=view;renderActive(view);return v4showConsolidado()}if(view==='relatorios-geral'){state.view=view;renderActive(view);return v4showRelatorioGeral()}return v4OriginalNav(view)};
// Add corporate buttons to sidebar after DOM is ready.
function v4WireSidebar(){document.querySelectorAll('.nav button[data-view="consolidado"]').forEach(b=>b.onclick=()=>nav('consolidado'));document.querySelectorAll('.nav button[data-view="relatorios-geral"]').forEach(b=>b.onclick=()=>nav('relatorios-geral'));document.querySelectorAll('.nav button[data-action="novo-emp"]').forEach(b=>b.onclick=()=>openEmpModal());document.querySelectorAll('.nav button[data-action="trocar"]').forEach(b=>b.onclick=()=>renderSelector())}
document.addEventListener('DOMContentLoaded',()=>{v4WireSidebar();setTimeout(v4WireSidebar,500)});
