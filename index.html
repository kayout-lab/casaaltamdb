<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASA ALTA | Master Data</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f8fafc;--line:#e6eaf0;--text:#172033;--muted:#6b7485;
  --brand:#2563eb;--brand-2:#0f4cbd;--brand-soft:#eaf1ff;--success:#138a5b;--success-soft:#e9f8f1;
  --warning:#b76b00;--warning-soft:#fff5dd;--danger:#c23b3b;--danger-soft:#fceded;--nav:#111827;--nav2:#182234;
  --shadow:0 10px 30px rgba(15,23,42,.06);--shadow-lg:0 22px 60px rgba(15,23,42,.14);--radius:18px;--radius-sm:12px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#dfeeff 0,#f6f8fc 42%,#f5f7fb 100%)}
.login-card{width:min(450px,94vw);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:26px;box-shadow:var(--shadow-lg);padding:34px}
.brandmark{display:flex;align-items:center;gap:12px}.brandmark .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#163a8b);display:grid;place-items:center;color:white;box-shadow:0 10px 24px rgba(37,99,235,.24)}.brandmark strong{font-size:17px;letter-spacing:.08em}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7a8495}.login-card h1{font-size:30px;line-height:1.15;margin:28px 0 8px}.login-card .sub{color:var(--muted);line-height:1.6;margin-bottom:28px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.field label{font-size:12px;font-weight:800;color:#556070;text-transform:uppercase;letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dce5;border-radius:12px;padding:12px 13px;background:#fff;color:var(--text);outline:none;transition:.18s}.field input:focus,.field select:focus,.field textarea:focus,.filter input:focus,.filter select:focus{border-color:#8fb4ff;box-shadow:0 0 0 4px rgba(37,99,235,.10)}.field textarea{resize:vertical;min-height:90px}.primary{border:0;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;box-shadow:0 8px 18px rgba(37,99,235,.18)}.primary:hover{filter:brightness(1.03)}.secondary{border:1px solid #d8dee8;background:#fff;color:#344054;border-radius:12px;padding:10px 14px;font-weight:700}.ghost{border:1px solid transparent;background:transparent;color:#5a6575;border-radius:12px;padding:10px 12px;font-weight:700}.danger{border:1px solid #f1c9c9;background:#fff;color:var(--danger);border-radius:12px;padding:10px 14px;font-weight:700}.error{margin-top:12px;color:var(--danger);font-size:13px;background:var(--danger-soft);border:1px solid #f4d0d0;border-radius:12px;padding:10px 12px}
/* app shell */
#app{min-height:100vh}.app-shell{display:grid;grid-template-columns:266px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#e8eef7;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}.sidebar-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center}.sidebar-brand .title{font-weight:900;font-size:15px;letter-spacing:.09em}.sidebar-brand small{display:block;color:#8e9bad;margin-top:2px;font-size:11px}.menu-label{padding:15px 10px 8px;color:#7f8ca0;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:#c7d0dc;text-align:left;padding:11px 12px;border-radius:12px;font-weight:750;transition:.18s}.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(37,99,235,.28),rgba(37,99,235,.12));color:#fff;border-color:rgba(96,165,250,.18)}.nav button:disabled{opacity:.35;cursor:not-allowed}.nav .icon{width:19px;height:19px;flex:0 0 19px}.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}.context-card{margin:10px 4px 4px;padding:13px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:15px}.context-card .small{color:#91a0b2;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.context-card strong{display:block;margin-top:6px;line-height:1.35;font-size:13px;color:white}.context-card button{margin-top:11px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eef7;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}
.topbar{height:72px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:10}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.breadcrumb strong{color:var(--text)}.top-actions{display:flex;align-items:center;gap:10px}.user-pill{display:flex;align-items:center;gap:9px;padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:999px;color:#475467;font-size:12px}.user-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:900;font-size:12px}
.content{padding:26px 30px 40px;overflow:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.page-head h1{margin:0;font-size:29px;letter-spacing:-.03em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.section{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.section-head h3{margin:0;font-size:16px;letter-spacing:-.01em}.section-head .muted{font-size:12px;color:var(--muted)}
/* home */
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-bottom:18px}.hero-card{padding:23px;border-radius:22px;background:linear-gradient(135deg,#eef5ff,#fff);border:1px solid #dbe7fb;box-shadow:var(--shadow)}.hero-card h2{margin:0;font-size:24px;letter-spacing:-.025em}.hero-card p{color:var(--muted);line-height:1.6;max-width:720px;margin:9px 0 0}.hero-side{padding:22px;border-radius:22px;background:#111827;color:#fff;box-shadow:var(--shadow)}.hero-side .label{color:#a8b3c3;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.hero-side .big{font-size:32px;font-weight:900;margin-top:7px}.hero-side .hint{color:#a8b3c3;font-size:12px;margin-top:4px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi-card{padding:17px}.kpi-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.kpi-icon{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}.kpi-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.kpi-value{font-size:28px;font-weight:900;margin-top:8px;letter-spacing:-.03em}.kpi-hint{font-size:12px;color:var(--muted);margin-top:4px}.portfolio-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.portfolio-table .row{display:grid;grid-template-columns:1.4fr .65fr .65fr .55fr .5fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.portfolio-table .row:last-child{border-bottom:0}.portfolio-table .head{color:#7a8495;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
/* filters and reports */
.filterbar{padding:13px;display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr 1fr 1fr auto;gap:9px;margin-bottom:15px}.filter input,.filter select,.filterbar input,.filterbar select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;color:var(--text)}.filterbar .clear{white-space:nowrap}.report-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:15px}.report-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.report-grid.three{grid-template-columns:1fr 1fr 1fr}.chart-box{height:300px;position:relative}.chart-box.tall{height:340px}.chart-box.small{height:250px}.legend-note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}.insight-list{display:grid;gap:10px}.insight{display:flex;gap:11px;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}.insight .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 9px}.insight strong{font-size:13px}.insight span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{text-align:left;color:#788396;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#fafbfc;position:sticky;top:0;z-index:1}.data-table th,.data-table td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table tbody tr:hover td{background:#fbfdff}
/* selector */
.selector{padding:12px 4px}.selector-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}.selector-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.emp-card{padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.emp-card:hover{transform:translateY(-2px);border-color:#bfd3fa;box-shadow:0 14px 30px rgba(15,23,42,.08)}.emp-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.emp-icon{width:42px;height:42px;border-radius:14px;background:#eef4ff;color:#255ccf;display:grid;place-items:center}.emp-card h3{font-size:17px;margin:15px 0 5px;letter-spacing:-.02em}.emp-meta{color:var(--muted);font-size:12px;line-height:1.6}.emp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.mini-stat{padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}.mini-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.mini-stat strong{display:block;margin-top:3px;font-size:15px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.badge.success{background:var(--success-soft);color:var(--success)}.badge.warn{background:var(--warning-soft);color:var(--warning)}.badge.neutral{background:#eef1f5;color:#596574}
/* modal/toast/loading */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(760px,96vw);max-height:92vh;overflow:auto;background:white;border-radius:22px;box-shadow:var(--shadow-lg)}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:17px}.modal-body{padding:19px}.modal-actions{padding:14px 19px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail{padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}.detail span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase}.detail strong{display:block;margin-top:4px;font-size:14px}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:100;display:grid;gap:9px}.toast{min-width:280px;max-width:420px;background:#111827;color:#fff;padding:12px 14px;border-radius:13px;box-shadow:var(--shadow-lg);font-size:13px}.toast.ok{background:#10382a}.toast.err{background:#4b1f1f}.loading{position:fixed;inset:0;z-index:90;background:rgba(245,247,251,.72);backdrop-filter:blur(4px);display:grid;place-items:center}.loading-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:20px 24px;display:flex;align-items:center;gap:12px;font-weight:800}.spinner{width:20px;height:20px;border-radius:50%;border:3px solid #dbe7fb;border-top-color:var(--brand);animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1180px){.app-shell{grid-template-columns:230px 1fr}.kpis,.report-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.portfolio-grid,.report-grid,.report-grid.three{grid-template-columns:1fr}.selector-grid{grid-template-columns:1fr 1fr}.filterbar{grid-template-columns:1fr 1fr}.filterbar input{grid-column:1/-1}}
@media(max-width:820px){.sidebar{display:none}.app-shell{grid-template-columns:1fr}.content{padding:20px 16px}.topbar{padding:0 16px}.selector-grid{grid-template-columns:1fr}.formgrid,.detail-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.kpis,.report-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.topbar .breadcrumb{display:none}.user-pill span{display:none}.kpis,.report-kpis,.filterbar{grid-template-columns:1fr}.emp-stats{grid-template-columns:1fr 1fr}.page-head h1{font-size:25px}}
@media print{.sidebar,.topbar,.actions,.filterbar,.selector-head{display:none!important}.content{padding:0}.surface{box-shadow:none}}
</style>
</head>
<body>
<section id="login">
  <div class="login-card">
    <div class="brandmark"><div class="logo">🏢</div><div><strong>CASA ALTA</strong><div class="eyebrow">MASTER DATA</div></div></div>
    <h1>Acesso ao sistema</h1>
    <div class="sub">Gestão centralizada de empreendimentos, unidades, proprietários e vendas.</div>
    <form id="loginForm">
      <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="primary" style="width:100%">Entrar</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="logo">🏢</div><div><div class="title">CASA ALTA</div><small>Master Data • 2026</small></div></div>
      <div id="contextCard" class="context-card hidden"><div class="small">Contexto ativo</div><strong id="contextName"></strong><button onclick="goHome()">Voltar ao portfólio</button></div>
      <div class="menu-label">Portfólio</div>
      <nav class="nav">
        <button data-view="home" title="Todos os empreendimentos"><span class="icon">🏠</span>Todos os empreendimentos</button>
        <button data-view="report-global" title="Relatório executivo"><span class="icon">📊</span>Relatório executivo</button>
        <button data-view="new-emp" title="Cadastrar empreendimento"><span class="icon">＋</span>Novo empreendimento</button>
      </nav>
      <div class="nav-sep"></div>
      <div class="menu-label">Empreendimento selecionado</div>
      <nav class="nav" id="contextNav">
        <button data-view="dashboard" disabled title="Selecione um empreendimento"><span class="icon">◈</span>Dashboard</button>
        <button data-view="units" disabled title="Selecione um empreendimento"><span class="icon">▦</span>Unidades</button>
        <button data-view="report-context" disabled title="Selecione um empreendimento"><span class="icon">◒</span>Relatórios</button>
      </nav>
      <div class="nav-sep"></div>
      <nav class="nav"><button id="signOut"><span class="icon">↪</span>Sair</button></nav>
    </aside>
    <div>
      <header class="topbar">
        <div class="breadcrumb"><span>CASA ALTA</span><span>›</span><strong id="crumb">Todos os empreendimentos</strong></div>
        <div class="top-actions"><button class="ghost" onclick="refreshCurrent()">↻ Atualizar</button><div class="user-pill"><div class="user-avatar" id="avatar">CA</div><span id="userEmail"></span></div></div>
      </header>
      <main class="content" id="main"></main>
    </div>
  </div>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="loading" class="loading hidden"><div class="loading-card"><div class="spinner"></div><span id="loadingText">Carregando...</span></div></div>

<script src="config.js"></script>
<script>
'use strict';
let sb=null;
const state={user:null,empreendimentos:[],selected:null,unidades:[],vendas:[],owners:[],view:'home',charts:{},globalFilters:{q:'',emp:'',tipo:'',ano:'',complete:''},contextFilters:{q:'',tipo:'',sfh:'',status:''},allLoaded:false,_allUnits:{},_allVendas:{},_allOwners:{}};
const $=id=>document.getElementById(id);
const main=()=>$('main');
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';
const fmtPct=n=>`${Math.round(n||0)}%`;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function icon(type){return ({building:'🏢',unit:'▦',sale:'◫',sfh:'◒',report:'📊',home:'⌂'}[type]||'•')}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('toastWrap').appendChild(t);setTimeout(()=>t.remove(),4200)}
function loading(on,text='Carregando...'){$('loadingText').textContent=text;$('loading').classList.toggle('hidden',!on)}
function showLoginError(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')}
function setLoginVisible(on){$('login').classList.toggle('hidden',!on);$('app').classList.toggle('hidden',on)}
function setupSupabase(){try{const cfg=window.APP_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_URL.includes('SEU-PROJETO')||cfg.SUPABASE_ANON_KEY.includes('SUA_CHAVE')){showLoginError('Configure o arquivo config.js com a URL e a chave publicável do Supabase.');return false}if(!window.supabase?.createClient){showLoginError('A biblioteca do Supabase não carregou. Recarregue a página e verifique a conexão.');return false}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);return true}catch(e){console.error(e);showLoginError('Não foi possível inicializar o Supabase.');return false}}
async function init(){if(!setupSupabase())return;try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await onSignedIn(data.session.user);sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user){state.user=s.user;await onSignedIn(s.user)}else{state.user=null;state.selected=null;setLoginVisible(true)}})}catch(e){console.error(e);showLoginError('Falha de conexão com o Supabase: '+(e.message||e))}}
async function onSignedIn(user){state.user=user;setLoginVisible(false);$('userEmail').textContent=user.email||'';$('avatar').textContent=(user.email||'CA').slice(0,2).toUpperCase();await loadEmpreendimentos();goHome()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').classList.add('hidden');const b=$('loginBtn');b.disabled=true;b.textContent='Entrando…';try{const {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;state.user=data.user;await onSignedIn(data.user)}catch(err){console.error(err);showLoginError(err.message||'Não foi possível entrar.')}finally{b.disabled=false;b.textContent='Entrar'}});
$('signOut').onclick=async()=>{await sb.auth.signOut()};
async function loadEmpreendimentos(){const {data,error}=await sb.from('empreendimentos').select('*').order('nome');if(error){toast(error.message,'err');return}state.empreendimentos=data||[];state.allLoaded=false}
function enableContextNav(){document.querySelectorAll('#contextNav button').forEach(b=>b.disabled=!state.selected);$('contextCard').classList.toggle('hidden',!state.selected);$('contextName').textContent=state.selected?.nome||''}
function setActiveNav(view){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const labels={home:'Todos os empreendimentos','report-global':'Relatório executivo','new-emp':'Novo empreendimento',dashboard:state.selected?.nome||'Dashboard',units:'Unidades', 'report-context':'Relatórios'};$('crumb').textContent=labels[view]||'CASA ALTA'}
function renderSelector(){state.selected=null;state.view='home';enableContextNav();setActiveNav('home');renderHome()}
function goHome(){state.selected=null;state.unidades=[];state.vendas=[];state.contextFilters={q:'',tipo:'',sfh:'',status:''};enableContextNav();setActiveNav('home');renderHome()}
async function selectEmp(id){const emp=state.empreendimentos.find(x=>x.id===id);if(!emp)return;loading(true,'Abrindo empreendimento…');try{state.selected=emp;await loadContext();enableContextNav();setActiveNav('dashboard');state.view='dashboard';renderDashboard()}finally{loading(false)}}
async function loadContext(){const e=state.selected;const [u,v,p]=await Promise.all([sb.from('unidades').select('*').eq('empreendimento_id',e.id).order('codigo'),sb.from('vendas').select('*').eq('empreendimento_id',e.id),sb.from('proprietarios').select('*')]);const err=u.error||v.error||p.error;if(err)throw err;state.unidades=u.data||[];state.vendas=v.data||[];state.owners=p.data||[]}

function renderContextReport(){clearCharts();state.view='report-context';setActiveNav('report-context');const data=contextRows(),all=state.vendas,types={};data.forEach(v=>types[v.tipo_venda]=(types[v.tipo_venda]||0)+1);const years={};data.forEach(v=>{if(v.data_sfh){const y=v.data_sfh.slice(0,4);years[y]=(years[y]||0)+1}});const comp=data.filter(v=>v.data_sfh).length,pending=data.length-comp;const floors={};state.unidades.forEach(u=>{const k=u.andar||'Não informado';floors[k]=(floors[k]||0)+1});const topFloors=Object.entries(floors).sort((a,b)=>b[1]-a[1]).slice(0,8);main().innerHTML=`<div class="page-head"><div><div class="eyebrow">${esc(state.selected.nome)}</div><h1>Relatórios</h1><p>Visão operacional e analítica do empreendimento selecionado.</p></div><div class="actions"><button class="secondary" onclick="window.print()">⎙ Imprimir</button><button class="secondary" onclick="exportContext()">⇩ Exportar CSV</button></div></div><div class="surface filterbar"><input placeholder="Unidade ou proprietário..." value="${esc(state.contextFilters.q)}" oninput="state.contextFilters.q=this.value;renderContextReport()"><select onchange="state.contextFilters.tipo=this.value;renderContextReport()"><option value="">Todos os tipos</option>${Object.keys(types).sort().map(t=>`<option value="${esc(t)}" ${state.contextFilters.tipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select onchange="state.contextFilters.sfh=this.value;renderContextReport()"><option value="">Data SFH — todos</option><option value="com" ${state.contextFilters.sfh==='com'?'selected':''}>Com Data SFH</option><option value="sem" ${state.contextFilters.sfh==='sem'?'selected':''}>Sem Data SFH</option></select><select onchange="state.contextFilters.status=this.value;renderContextReport()"><option value="">Todos os status</option>${[...new Set(all.map(v=>v.status).filter(Boolean))].sort().map(t=>`<option value="${esc(t)}" ${state.contextFilters.status===t?'selected':''}>${esc(t)}</option>`).join('')}</select><button class="secondary clear" onclick="state.contextFilters={q:'',tipo:'',sfh:'',status:''};renderContextReport()">Limpar</button></div><div class="report-kpis">${kpi('Registros',data.length,'Universo filtrado',icon('sale'))}${kpi('Com Data SFH',comp,data.length?fmtPct(comp/data.length*100):'0%',icon('sfh'))}${kpi('Pendências',pending,'Sem Data SFH',icon('report'))}${kpi('Proprietários',new Set(data.map(v=>v.proprietario_id).filter(Boolean)).size,'Distintos',icon('building'))}${kpi('Unidades',new Set(data.map(v=>v.unidade_id)).size,'Com venda no filtro',icon('unit'))}</div><div class="report-grid"><div class="surface section"><div class="section-head"><div><h3>Mix por tipo de venda</h3><div class="muted">Dados do empreendimento</div></div></div><div class="chart-box"><canvas id="rType"></canvas></div></div><div class="surface section"><div class="section-head"><div><h3>Data SFH por ano</h3><div class="muted">Concentração temporal</div></div></div><div class="chart-box"><canvas id="rYear"></canvas></div></div></div><div class="report-grid three"><div class="surface section"><div class="section-head"><div><h3>Qualidade do cadastro</h3><div class="muted">Completude do campo Data SFH</div></div></div><div class="chart-box"><canvas id="rQuality"></canvas></div></div><div class="surface section"><div class="section-head"><div><h3>Distribuição por andar</h3><div class="muted">Unidades cadastradas</div></div></div><div class="chart-box tall"><canvas id="rFloor"></canvas></div></div><div class="surface section"><div class="section-head"><div><h3>Alertas</h3><div class="muted">Prioridades de saneamento</div></div></div><div class="insight-list"><div class="insight"><div class="dot"></div><div><strong>${pending} registros sem Data SFH.</strong><span>Priorize a atualização para aumentar a completude.</span></div></div><div class="insight"><div class="dot"></div><div><strong>${data.length?fmtPct(comp/data.length*100):'0%'} de cobertura.</strong><span>Índice calculado sobre o universo filtrado.</span></div></div><div class="insight"><div class="dot"></div><div><strong>${Object.keys(types).length} tipos de venda.</strong><span>Mix atual deste empreendimento.</span></div></div></div></div></div>`;setTimeout(()=>{donut('rType',Object.keys(types),Object.values(types));chart('rYear','bar',Object.keys(years).sort(),Object.keys(years).sort().map(y=>years[y]),'Registros');donut('rQuality',['Com Data SFH','Sem Data SFH'],[comp,pending]);chart('rFloor','bar',topFloors.map(x=>x[0]),topFloors.map(x=>x[1]),'Unidades',{backgroundColor:'rgba(90,163,255,.72)'})},0)}
async function openEmpModal(empId){const e=state.empreendimentos.find(x=>x.id===empId);$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><strong>${e?'Editar empreendimento':'Cadastrar empreendimento'}</strong><button class="secondary" onclick="closeModal()">Fechar</button></div><form id="empForm"><div class="modal-body"><div class="formgrid"><div class="field"><label>Nome *</label><input name="nome" value="${esc(e?.nome||'')}" required></div><div class="field"><label>Status</label><select name="status"><option ${!e||e.status==='Ativo'?'selected':''}>Ativo</option><option ${e?.status==='Inativo'?'selected':''}>Inativo</option></select></div><div class="field"><label>Cidade</label><input name="cidade" value="${esc(e?.cidade||'')}"></div><div class="field"><label>Construtora</label><input name="construtora" value="${esc(e?.construtora||'')}"></div><div class="field span2"><label>Endereço</label><input name="endereco" value="${esc(e?.endereco||'')}"></div></div></div><div class="modal-actions">${e?`<button type="button" class="danger" onclick="deleteEmp('${e.id}')">Excluir</button>`:''}<span style="flex:1"></span><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div></form></div>`;$('empForm').onsubmit=async ev=>{ev.preventDefault();await saveEmp(e,new FormData(ev.target))}}
async function saveEmp(e,f){const payload={nome:String(f.get('nome')||'').trim(),status:f.get('status')||'Ativo',cidade:String(f.get('cidade')||'').trim()||null,construtora:String(f.get('construtora')||'').trim()||null,endereco:String(f.get('endereco')||'').trim()||null};if(!payload.nome)return toast('Informe o nome do empreendimento.','err');loading(true,'Salvando empreendimento…');try{const r=e?await sb.from('empreendimentos').update(payload).eq('id',e.id).select().single():await sb.from('empreendimentos').insert(payload).select().single();if(r.error)throw r.error;closeModal();state.allLoaded=false;await loadEmpreendimentos();toast(e?'Empreendimento atualizado.':'Empreendimento criado.','ok');if(r.data&&e?.id===state.selected?.id){state.selected=r.data;await loadContext();renderDashboard()}else if(!e&&r.data){await selectEmp(r.data.id)}else{goHome()}}catch(err){toast(err.message||'Não foi possível salvar.','err')}finally{loading(false)}}
async function deleteEmp(id){if(!confirm('Excluir este empreendimento e as unidades/vendas vinculadas?'))return;loading(true,'Excluindo empreendimento…');try{const {error}=await sb.from('empreendimentos').delete().eq('id',id);if(error)throw error;closeModal();state.allLoaded=false;state.selected=null;await loadEmpreendimentos();toast('Empreendimento excluído.','ok');goHome()}catch(err){toast(err.message||'Não foi possível excluir.','err')}finally{loading(false)}}
async function openUnitModal(unitId){if(!state.selected)return;const u=state.unidades.find(x=>x.id===unitId);const v=state.vendas.find(x=>x.unidade_id===unitId)||{};const p=state.owners.find(x=>x.id===v.proprietario_id)||{};$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><strong>${u?'Editar unidade / venda':'Novo cadastro'}</strong><button class="secondary" onclick="closeModal()">Fechar</button></div><form id="unitForm"><div class="modal-body"><div class="formgrid"><div class="field"><label>Unidade *</label><input name="codigo" value="${esc(u?.codigo||'')}" required></div><div class="field"><label>Bloco</label><input name="bloco" value="${esc(u?.bloco||'')}"></div><div class="field"><label>Andar</label><input name="andar" value="${esc(u?.andar||'')}"></div><div class="field"><label>Tipologia</label><input name="tipologia" value="${esc(u?.tipologia||'')}"></div><div class="field"><label>Status unidade</label><input name="status_unidade" value="${esc(u?.status||'Cadastrada')}"></div><div class="field"><label>Proprietário</label><input name="proprietario" value="${esc(p?.nome||'')}" placeholder="Nome completo"></div><div class="field"><label>Data SFH</label><input name="data_sfh" type="date" value="${esc(v?.data_sfh||'')}"></div><div class="field"><label>Tipo de venda</label><input name="tipo_venda" value="${esc(v?.tipo_venda||'Não informado')}"></div><div class="field"><label>Status da venda</label><input name="status_venda" value="${esc(v?.status||'Ativa')}"></div><div class="field span2"><label>Observações</label><textarea name="observacoes">${esc(v?.observacoes||'')}</textarea></div></div></div><div class="modal-actions">${u?`<button type="button" class="danger" onclick="deleteUnit('${u.id}')">Excluir</button>`:''}<span style="flex:1"></span><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div></form></div>`;$('unitForm').onsubmit=async ev=>{ev.preventDefault();await saveUnit(u,v,new FormData(ev.target))}}
async function saveUnit(u,v,f){loading(true,'Salvando cadastro…');try{const payload={empreendimento_id:state.selected.id,codigo:String(f.get('codigo')||'').trim(),bloco:String(f.get('bloco')||'').trim()||null,andar:String(f.get('andar')||'').trim()||null,tipologia:String(f.get('tipologia')||'').trim()||null,status:String(f.get('status_unidade')||'Cadastrada').trim()||'Cadastrada'};let ur=u?await sb.from('unidades').update(payload).eq('id',u.id).select().single():await sb.from('unidades').insert(payload).select().single();if(ur.error)throw ur.error;let propId=null;const pname=String(f.get('proprietario')||'').trim();if(pname){const existing=await sb.from('proprietarios').select('id').eq('nome',pname).maybeSingle();if(existing.error)throw existing.error;if(existing.data)propId=existing.data.id;else{const pr=await sb.from('proprietarios').insert({nome:pname}).select('id').single();if(pr.error)throw pr.error;propId=pr.data.id}}if(u&&v.id){const vr=await sb.from('vendas').update({empreendimento_id:state.selected.id,unidade_id:ur.data.id,proprietario_id:propId,data_sfh:f.get('data_sfh')||null,tipo_venda:String(f.get('tipo_venda')||'Não informado'),status:String(f.get('status_venda')||'Ativa'),observacoes:String(f.get('observacoes')||'')||null}).eq('id',v.id);if(vr.error)throw vr.error}else{const vr=await sb.from('vendas').insert({empreendimento_id:state.selected.id,unidade_id:ur.data.id,proprietario_id:propId,data_sfh:f.get('data_sfh')||null,tipo_venda:String(f.get('tipo_venda')||'Não informado'),status:String(f.get('status_venda')||'Ativa'),observacoes:String(f.get('observacoes')||'')||null});if(vr.error)throw vr.error}closeModal();state.allLoaded=false;await loadContext();await loadEmpreendimentos();toast(u?'Cadastro atualizado.':'Cadastro criado.','ok');renderUnits()}catch(err){toast(err.message||'Não foi possível salvar o cadastro.','err')}finally{loading(false)}}
async function deleteUnit(id){if(!confirm('Excluir esta unidade e a venda vinculada?'))return;loading(true,'Excluindo cadastro…');try{const {error}=await sb.from('unidades').delete().eq('id',id);if(error)throw error;state.allLoaded=false;await loadContext();toast('Cadastro excluído.','ok');closeModal();renderUnits()}catch(err){toast(err.message||'Não foi possível excluir.','err')}finally{loading(false)}}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function exportRows(rows,filename){const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
function exportPortfolio(){const rows=portfolioRows().map(({e,m})=>[e.nome,e.cidade||'',e.status||'',m.u,m.v,m.sfh,m.pend,m.complete+'%']);exportRows([['Empreendimento','Cidade','Status','Unidades','Vendas','SFH','Sem Data SFH','Completude'],...rows],'portfolio_empreendimentos.csv')}
function exportGlobalReport(){const rows=filteredGlobal().map(v=>{const e=state.empreendimentos.find(x=>x.id===v.empId);const u=(state._allUnits[v.empId]||[]).find(x=>x.id===v.unidade_id);const p=state._allOwners[v.proprietario_id];return[e?.nome||'',u?.codigo||'',p?.nome||'',v.data_sfh||'',v.tipo_venda||'',v.status||'']});exportRows([['Empreendimento','Unidade','Proprietário','Data SFH','Tipo de Venda','Status'],...rows],'relatorio_executivo.csv')}
function exportContext(){const rows=state.vendas.map(v=>{const u=state.unidades.find(x=>x.id===v.unidade_id);const p=state.owners.find(x=>x.id===v.proprietario_id);return[state.selected.nome,u?.codigo||'',p?.nome||'',v.data_sfh||'',v.tipo_venda||'',v.status||'']});exportRows([['Empreendimento','Unidade','Proprietário','Data SFH','Tipo de Venda','Status'],...rows],'empreendimento_'+norm(state.selected.nome).replace(/\s+/g,'_')+'.csv')}
async function navigate(view){if(view==='home'){goHome();return}if(view==='new-emp'){setActiveNav(view);state.view=view;openEmpModal();return}if(view==='report-global'){state.view=view;await renderGlobalReport();return}if(!state.selected){toast('Selecione um empreendimento para acessar esta área.','err');renderSelector();return}state.view=view; if(view==='dashboard')renderDashboard(); if(view==='units')renderUnits(); if(view==='report-context')renderContextReport()}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
