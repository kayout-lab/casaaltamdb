<html lang="pt-BR">
<head>

<title>CASA ALTA | Master Data</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f8fafc;--line:#e6eaf0;--text:#172033;--muted:#6b7485;
  --brand:#2563eb;--brand-2:#0f4cbd;--brand-soft:#eaf1ff;--success:#138a5b;--success-soft:#e9f8f1;
  --warning:#b76b00;--warning-soft:#fff5dd;--danger:#c23b3b;--danger-soft:#fceded;--nav:#111827;--nav2:#182234;
  --shadow:0 10px 30px rgba(15,23,42,.06);--shadow-lg:0 22px 60px rgba(15,23,42,.14);--radius:18px;--radius-sm:12px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#dfeeff 0,#f6f8fc 42%,#f5f7fb 100%)}
.login-card{width:min(450px,94vw);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:26px;box-shadow:var(--shadow-lg);padding:34px}
.brandmark{display:flex;align-items:center;gap:12px}.brandmark .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#163a8b);display:grid;place-items:center;color:white;box-shadow:0 10px 24px rgba(37,99,235,.24)}.brandmark strong{font-size:17px;letter-spacing:.08em}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7a8495}.login-card h1{font-size:30px;line-height:1.15;margin:28px 0 8px}.login-card .sub{color:var(--muted);line-height:1.6;margin-bottom:28px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.field label{font-size:12px;font-weight:800;color:#556070;text-transform:uppercase;letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dce5;border-radius:12px;padding:12px 13px;background:#fff;color:var(--text);outline:none;transition:.18s}.field input:focus,.field select:focus,.field textarea:focus,.filter input:focus,.filter select:focus{border-color:#8fb4ff;box-shadow:0 0 0 4px rgba(37,99,235,.10)}.field textarea{resize:vertical;min-height:90px}.primary{border:0;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;box-shadow:0 8px 18px rgba(37,99,235,.18)}.primary:hover{filter:brightness(1.03)}.secondary{border:1px solid #d8dee8;background:#fff;color:#344054;border-radius:12px;padding:10px 14px;font-weight:700}.ghost{border:1px solid transparent;background:transparent;color:#5a6575;border-radius:12px;padding:10px 12px;font-weight:700}.danger{border:1px solid #f1c9c9;background:#fff;color:var(--danger);border-radius:12px;padding:10px 14px;font-weight:700}.error{margin-top:12px;color:var(--danger);font-size:13px;background:var(--danger-soft);border:1px solid #f4d0d0;border-radius:12px;padding:10px 12px}
/* app shell */
#app{min-height:100vh}.app-shell{display:grid;grid-template-columns:266px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#e8eef7;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}.sidebar-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center}.sidebar-brand .title{font-weight:900;font-size:15px;letter-spacing:.09em}.sidebar-brand small{display:block;color:#8e9bad;margin-top:2px;font-size:11px}.menu-label{padding:15px 10px 8px;color:#7f8ca0;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:#c7d0dc;text-align:left;padding:11px 12px;border-radius:12px;font-weight:750;transition:.18s}.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(37,99,235,.28),rgba(37,99,235,.12));color:#fff;border-color:rgba(96,165,250,.18)}.nav button:disabled{opacity:.35;cursor:not-allowed}.nav .icon{width:19px;height:19px;flex:0 0 19px}.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}.context-card{margin:10px 4px 4px;padding:13px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:15px}.context-card .small{color:#91a0b2;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.context-card strong{display:block;margin-top:6px;line-height:1.35;font-size:13px;color:white}.context-card button{margin-top:11px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eef7;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}
.topbar{height:72px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:10}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.breadcrumb strong{color:var(--text)}.top-actions{display:flex;align-items:center;gap:10px}.user-pill{display:flex;align-items:center;gap:9px;padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:999px;color:#475467;font-size:12px}.user-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:900;font-size:12px}
.content{padding:26px 30px 40px;overflow:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.page-head h1{margin:0;font-size:29px;letter-spacing:-.03em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.section{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.section-head h3{margin:0;font-size:16px;letter-spacing:-.01em}.section-head .muted{font-size:12px;color:var(--muted)}

.finance-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:15px}
.finance-card{padding:16px;background:linear-gradient(180deg,#fff,#fbfcff)}
.finance-card .small{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.finance-card strong{display:block;font-size:21px;margin-top:7px;letter-spacing:-.025em}
.finance-card span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.stage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stage{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}
.stage .stage-name{font-size:11px;font-weight:900;color:#687385;text-transform:uppercase;letter-spacing:.04em}
.stage .stage-value{font-size:15px;font-weight:900;margin-top:6px}
.filterbar .compact{min-width:0}
.report-caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;color:#647083;font-size:12px}
@media(max-width:1180px){.finance-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.stage-grid{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.finance-strip,.stage-grid{grid-template-columns:1fr}}

/* home */
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-bottom:18px}.hero-card{padding:23px;border-radius:22px;background:linear-gradient(135deg,#eef5ff,#fff);border:1px solid #dbe7fb;box-shadow:var(--shadow)}.hero-card h2{margin:0;font-size:24px;letter-spacing:-.025em}.hero-card p{color:var(--muted);line-height:1.6;max-width:720px;margin:9px 0 0}.hero-side{padding:22px;border-radius:22px;background:#111827;color:#fff;box-shadow:var(--shadow)}.hero-side .label{color:#a8b3c3;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.hero-side .big{font-size:32px;font-weight:900;margin-top:7px}.hero-side .hint{color:#a8b3c3;font-size:12px;margin-top:4px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi-card{padding:17px}.kpi-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.kpi-icon{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}.kpi-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.kpi-value{font-size:28px;font-weight:900;margin-top:8px;letter-spacing:-.03em}.kpi-hint{font-size:12px;color:var(--muted);margin-top:4px}.portfolio-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.portfolio-table .row{display:grid;grid-template-columns:1.4fr .65fr .65fr .55fr .5fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.portfolio-table .row:last-child{border-bottom:0}.portfolio-table .head{color:#7a8495;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}

.home-head{margin-bottom:12px}.home-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.home-kpi{padding:12px 14px}.home-kpi span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.home-kpi strong{display:block;font-size:22px;margin-top:4px;letter-spacing:-.02em}.folder-surface{overflow:hidden}.folder-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.folder-head h3{margin:0;font-size:15px}.folder-count{min-width:30px;height:30px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:12px}.folder-list{padding:4px 10px}.folder-row{display:grid;grid-template-columns:42px minmax(0,1fr) 100px 160px 26px;gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s ease,transform .15s ease}.folder-row:last-child{border-bottom:0}.folder-row:hover,.folder-row:focus{background:#f7faff;outline:none}.folder-row:focus-visible{box-shadow:inset 0 0 0 2px rgba(37,99,235,.25)}.folder-icon{width:36px;height:36px;border-radius:11px;background:#eef4ff;color:var(--brand);display:grid;place-items:center}.folder-icon svg{width:19px;height:19px}.folder-main{min-width:0}.folder-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-main span{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-metric{display:flex;flex-direction:column;gap:3px}.folder-metric span{font-size:10px;color:#8a94a3;text-transform:uppercase;font-weight:800;letter-spacing:.05em}.folder-metric strong{font-size:13px}.folder-value{text-align:right}.folder-arrow{text-align:right;color:#95a0b0;font-size:24px;line-height:1}.home-head .actions{align-self:flex-start}@media(max-width:760px){.home-kpis{grid-template-columns:1fr}.folder-row{grid-template-columns:36px minmax(0,1fr) 24px}.folder-metric{display:none}.folder-arrow{font-size:22px}}
/* filters and reports */
.filterbar{padding:13px;display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr 1fr 1fr auto;gap:9px;margin-bottom:15px}.filter input,.filter select,.filterbar input,.filterbar select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;color:var(--text)}.filterbar .clear{white-space:nowrap}.report-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:15px}.report-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.report-grid.three{grid-template-columns:1fr 1fr 1fr}.chart-box{height:300px;position:relative}.chart-box.tall{height:340px}.chart-box.small{height:250px}.legend-note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}.insight-list{display:grid;gap:10px}.insight{display:flex;gap:11px;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}.insight .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 9px}.insight strong{font-size:13px}.insight span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{text-align:left;color:#788396;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#fafbfc;position:sticky;top:0;z-index:1}.data-table th,.data-table td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table tbody tr:hover td{background:#fbfdff}
/* selector */
.selector{padding:12px 4px}.selector-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}.selector-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.emp-card{padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.emp-card:hover{transform:translateY(-2px);border-color:#bfd3fa;box-shadow:0 14px 30px rgba(15,23,42,.08)}.emp-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.emp-icon{width:42px;height:42px;border-radius:14px;background:#eef4ff;color:#255ccf;display:grid;place-items:center}.emp-card h3{font-size:17px;margin:15px 0 5px;letter-spacing:-.02em}.emp-meta{color:var(--muted);font-size:12px;line-height:1.6}.emp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.mini-stat{padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}.mini-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.mini-stat strong{display:block;margin-top:3px;font-size:15px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.badge.success{background:var(--success-soft);color:var(--success)}.badge.warn{background:var(--warning-soft);color:var(--warning)}.badge.neutral{background:#eef1f5;color:#596574}
/* modal/toast/loading */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(760px,96vw);max-height:92vh;overflow:auto;background:white;border-radius:22px;box-shadow:var(--shadow-lg)}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:17px}.modal-body{padding:19px}.modal-actions{padding:14px 19px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail{padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}.detail span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase}.detail strong{display:block;margin-top:4px;font-size:14px}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:100;display:grid;gap:9px}.toast{min-width:280px;max-width:420px;background:#111827;color:#fff;padding:12px 14px;border-radius:13px;box-shadow:var(--shadow-lg);font-size:13px}.toast.ok{background:#10382a}.toast.err{background:#4b1f1f}.loading{position:fixed;inset:0;z-index:90;background:rgba(245,247,251,.72);backdrop-filter:blur(4px);display:grid;place-items:center}.loading-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:20px 24px;display:flex;align-items:center;gap:12px;font-weight:800}.spinner{width:20px;height:20px;border-radius:50%;border:3px solid #dbe7fb;border-top-color:var(--brand);animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1180px){.app-shell{grid-template-columns:230px 1fr}.kpis,.report-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.portfolio-grid,.report-grid,.report-grid.three{grid-template-columns:1fr}.selector-grid{grid-template-columns:1fr 1fr}.filterbar{grid-template-columns:1fr 1fr}.filterbar input{grid-column:1/-1}}
@media(max-width:820px){.sidebar{display:none}.app-shell{grid-template-columns:1fr}.content{padding:20px 16px}.topbar{padding:0 16px}.selector-grid{grid-template-columns:1fr}.formgrid,.detail-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.kpis,.report-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.topbar .breadcrumb{display:none}.user-pill span{display:none}.kpis,.report-kpis,.filterbar{grid-template-columns:1fr}.emp-stats{grid-template-columns:1fr 1fr}.page-head h1{font-size:25px}}
@media print{.sidebar,.topbar,.actions,.filterbar,.selector-head{display:none!important}.content{padding:0}.surface{box-shadow:none}}

/* V8 frontend - clean 2026 */
:root{
 --bg:#f4f6fa;--surface:#fff;--surface-2:#f8fafc;--line:#e2e8f0;--text:#172033;--muted:#6a7484;
 --brand:#2b62e8;--brand-2:#1d4ed8;--brand-soft:#edf3ff;--success:#16845a;--success-soft:#eaf8f2;
 --warning:#a76908;--warning-soft:#fff6df;--danger:#b93f3f;--danger-soft:#fdeeee;--nav:#0e1624;--nav2:#142238;
 --shadow:0 8px 26px rgba(15,23,42,.05);--shadow-lg:0 24px 64px rgba(15,23,42,.14);--radius:20px;--radius-sm:14px;
}
.app-shell{grid-template-columns:252px 1fr;transition:grid-template-columns .22s ease}
.sidebar{padding:14px 12px;box-shadow:12px 0 32px rgba(15,23,42,.04);z-index:30}
.sidebar-brand{padding:4px 8px 18px}
.sidebar-mini-toggle{margin-left:auto;width:32px;height:32px;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:#c9d4e2;font-size:20px;line-height:1}
.sidebar-mini-toggle:hover{background:rgba(255,255,255,.12);color:#fff}
.context-card{padding:11px;border-radius:14px}
.context-card strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-back{margin-top:8px;width:100%;display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#cbd5e1;padding:8px 9px;border-radius:10px;font-size:11px;font-weight:750}
.nav button{padding:10px 11px;border-radius:11px;font-size:13px}
.nav button .icon{width:19px;flex:0 0 19px;display:grid;place-items:center}
.topbar{height:64px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.84);backdrop-filter:blur(15px);position:sticky;top:0;z-index:20}
.top-left{display:flex;align-items:center;gap:11px}
.top-icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;color:#405169;font-weight:800}
.content{padding:28px 30px 40px;max-width:1680px;margin:0 auto}
.page-head{margin-bottom:18px}.page-head h1{font-size:29px;letter-spacing:-.035em}.page-head p{font-size:13px;max-width:780px}
.clean-title{margin-bottom:6px}.surface{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow)}
.section{padding:20px}.section-head h3{font-size:15px;letter-spacing:-.02em}
.home-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 18px}
.home-summary .pill{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:#56657a}
.home-summary .sep{color:#b8c1cd}.portfolio-grid.single{grid-template-columns:1fr}.portfolio-head{margin-bottom:14px}
.emp-card{padding:17px;min-height:218px;border-radius:17px}.emp-card h3{font-size:15px;margin-top:13px}.emp-card .primary{height:38px;padding:8px 12px}
.emp-stats{margin-top:12px}.mini-stat{padding:9px;border-radius:11px}.mini-stat strong{font-size:14px}
.filters-card{padding:14px;margin-bottom:15px}.filters-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}
.filters-title strong{font-size:13px}.filter-grid{display:grid;grid-template-columns:2fr 1.15fr 1.15fr 1fr 1fr 1fr;gap:9px}
.filter-control{min-width:0}.filter-control input,.filter-control select{width:100%;height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fbfcfe;outline:none;color:var(--text)}
.filter-control input:focus,.filter-control select:focus{border-color:#aac4ff;box-shadow:0 0 0 4px rgba(43,98,232,.08);background:#fff}
.filter-actions{display:flex;align-items:center;gap:8px;margin-top:9px}.filter-actions input{width:160px;height:38px;padding:9px 11px;border:1px solid var(--line);border-radius:11px}
.report-grid{gap:14px}.report-chart-card{min-height:355px}.chart-box{height:282px}.chart-box.tall{height:350px}.chart-box.compact{height:235px}
.finance-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.finance-card{padding:15px 16px;border-radius:16px}
.finance-card strong{font-size:21px;letter-spacing:-.03em}.finance-card span{font-size:11px;color:var(--muted)}
.executive-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
.data-table tbody tr.unit-row{cursor:pointer}.data-table tbody tr.unit-row:hover td{background:#f7faff}.data-table tbody tr.unit-row:focus-visible td{outline:2px solid #9bbcff;outline-offset:-2px}
.table-link{font-weight:850;color:#1f4fc3}.table-note{font-size:11px;color:var(--muted);margin-top:7px}
.empty-state{padding:46px 24px;text-align:center;color:var(--muted)}.empty-state strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.nav-collapsed .app-shell{grid-template-columns:78px 1fr}.nav-collapsed .sidebar-brand .brand-copy,.nav-collapsed .sidebar-mini-toggle{display:none}
.nav-collapsed .menu-label,.nav-collapsed .context-card .small,.nav-collapsed .context-card strong,.nav-collapsed .context-back .nav-text,.nav-collapsed .nav-text{display:none}
.nav-collapsed .sidebar-brand{justify-content:center}.nav-collapsed .context-card{display:flex;justify-content:center}.nav-collapsed .context-back{justify-content:center}.nav-collapsed .nav button{justify-content:center}
.mobile-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:25}
@media(max-width:1180px){.content{padding:22px 20px 34px}.filter-grid{grid-template-columns:1fr 1fr 1fr}.filter-control:first-child{grid-column:1/-1}.report-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
 .app-shell{grid-template-columns:1fr}.sidebar{display:block;position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-102%);transition:transform .22s ease;z-index:40}
 .sidebar.open{transform:translateX(0)}.nav-collapsed .app-shell{grid-template-columns:1fr}.topbar{padding:0 15px}.content{padding:19px 14px 28px}
 .filter-grid{grid-template-columns:1fr 1fr}.filter-control:first-child{grid-column:1/-1}.finance-strip,.report-grid,.report-grid.three{grid-template-columns:1fr}.selector-grid{grid-template-columns:1fr}
}
@media(max-width:560px){.filter-grid{grid-template-columns:1fr}.filter-control:first-child{grid-column:auto}.topbar .breadcrumb{display:none}.top-actions .ghost{display:none}.home-summary{margin-bottom:14px}}
@media print{.sidebar,.topbar,.filters-card,.actions{display:none!important}.content{padding:0;max-width:none}.surface{box-shadow:none}}

<body>
<section id="login">
  <div class="login-card">
    <div class="brandmark"><div class="logo">🏢</div><div><strong>CASA ALTA</strong><div class="eyebrow">MASTER DATA</div></div></div>
    <h1>Acesso ao sistema</h1>
    <div class="sub">Gestão centralizada de empreendimentos, unidades, proprietários e vendas.</div>
    <form id="loginForm">
      <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="primary" style="width:100%">Entrar</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">▦</div>
        <div class="brand-copy"><div class="title">CASA ALTA</div><small>Master Data</small></div>
        <button class="sidebar-mini-toggle" title="Recolher menu" onclick="toggleSidebar()">‹</button>
      </div>
      <div id="contextCard" class="context-card hidden">
        <div class="small">Empreendimento ativo</div>
        <strong id="contextName"></strong>
        <button class="context-back" onclick="goHome()"><span class="icon">⌂</span><span class="nav-text">Todos os empreendimentos</span></button>
      </div>
      <div class="menu-label">Portfólio</div>
      <nav class="nav">
        <button data-view="home" title="Todos os empreendimentos"><span class="icon">⌂</span><span class="nav-text">Todos os empreendimentos</span></button>
        <button data-view="report-global" title="Relatório executivo"><span class="icon">◫</span><span class="nav-text">Relatório executivo</span></button>
        <button data-view="new-emp" title="Cadastrar empreendimento"><span class="icon">＋</span><span class="nav-text">Novo empreendimento</span></button>
      </nav>
      <div class="nav-sep"></div>
      <div class="menu-label">Empreendimento selecionado</div>
      <nav class="nav" id="contextNav">
        <button data-view="dashboard" disabled title="Selecione um empreendimento"><span class="icon">◈</span><span class="nav-text">Dashboard</span></button>
        <button data-view="units" disabled title="Selecione um empreendimento"><span class="icon">▦</span><span class="nav-text">Unidades</span></button>
        <button data-view="report-context" disabled title="Selecione um empreendimento"><span class="icon">◫</span><span class="nav-text">Relatórios</span></button>
      </nav>
      <div class="nav-sep"></div>
      <nav class="nav"><button id="signOut" title="Sair"><span class="icon">↪</span><span class="nav-text">Sair</span></button></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left">
          <button id="sidebarToggle" class="top-icon-btn" onclick="toggleSidebar()" title="Mostrar/ocultar menu">☰</button>
          <div class="breadcrumb"><span>CASA ALTA</span><span>›</span><strong id="crumb">Todos os empreendimentos</strong></div>
        </div>
        <div class="top-actions">
          <button class="ghost" onclick="refreshCurrent()">↻ Atualizar</button>
          <div class="user-pill"><div class="user-avatar" id="avatar">CA</div><span id="userEmail"></span></div>
        </div>
      </header>
      <main class="content" id="main"></main>
    </div>
  </div>
</div>
<div id="mobileBackdrop" class="mobile-backdrop hidden" onclick="toggleSidebar(false)"></div>
<div id="modal" class="modal hidden"></div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="loading" class="loading hidden"><div class="loading-card"><div class="spinner"></div><span id="loadingText">Carregando...</span></div></div>

<script src="config.js"></script>
<script>
'use strict';
let sb=null;
const state={user:null,empreendimentos:[],_rawEmpreendimentos:[],selected:null,unidades:[],vendas:[],owners:[],view:'home',charts:{},globalFilters:{q:'',emp:'',tipo:'',anoVenda:'',sfh:'',minValor:'',maxValor:''},contextFilters:{q:'',tipo:'',sfh:'',anoVenda:'',minValor:'',maxValor:''},allLoaded:false,_allUnits:{},_allVendas:{},_allOwners:{},_restored:false};
const $=id=>document.getElementById(id);
const moneyFmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
const money0=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(n)||0);
const numValue=v=>v===null||v===undefined||v===''?null:Number(v)||0;
const sumField=(rows,k)=>rows.reduce((s,v)=>s+(numValue(v[k])??0),0);
const hasField=(v,k)=>v[k]!==null&&v[k]!==undefined&&v[k]!=='';
const financeSummary=rows=>{const valued=rows.filter(v=>Number.isFinite(Number(v.valor_venda)));const sale=sumField(valued,'valor_venda'),rp=sumField(valued,'recursos_proprios'),fin=sumField(valued,'financiamento'),fgts=sumField(valued,'fgts'),sub=sumField(valued,'subsidio');return {sale,rp,fin,fgts,sub,avg:valued.length?sale/valued.length:0,valuedCount:valued.length};};
const main=()=>$('main');
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';
const fmtPct=n=>`${Math.round(n||0)}%`;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}

// Fonte de verdade do portfólio: o próprio Supabase.
// Não existe lista fixa de empreendimentos no frontend. O banco define quais
// empreendimentos existem, e seus IDs são usados nos relacionamentos.
const hasUsefulValues = arr => Array.isArray(arr) && arr.length && arr.some(v => Number(v) > 0);
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('toastWrap').appendChild(t);setTimeout(()=>t.remove(),4200)}
function loading(on,text='Carregando...'){$('loadingText').textContent=text;$('loading').classList.toggle('hidden',!on)}
function showLoginError(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')}
function setLoginVisible(on){$('login').classList.toggle('hidden',!on);$('app').classList.toggle('hidden',on)}
function setupSupabase(){try{const cfg=window.APP_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_URL.includes('SEU-PROJETO')||cfg.SUPABASE_ANON_KEY.includes('SUA_CHAVE')){showLoginError('Configure o arquivo config.js com a URL e a chave publicável do Supabase.');return false}if(!window.supabase?.createClient){showLoginError('A biblioteca do Supabase não carregou. Recarregue a página e verifique a conexão.');return false}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);return true}catch(e){console.error(e);showLoginError('Não foi possível inicializar o Supabase.');return false}}
const workspaceKey=()=>state.user?.id?`casaalta:workspace:${state.user.id}`:'casaalta:workspace:anon';
function persistWorkspace(){try{if(!state.user)return;sessionStorage.setItem(workspaceKey(),JSON.stringify({view:state.view,selectedId:state.selected?.id||null,ts:Date.now()}))}catch(e){console.warn('Não foi possível persistir o estado da interface.',e)}}
function clearWorkspacePersistence(){try{if(state.user)sessionStorage.removeItem(workspaceKey())}catch(e){}}
async function restoreWorkspace(){if(state._restored)return;state._restored=true;try{const raw=sessionStorage.getItem(workspaceKey());if(!raw){await renderHome();return}const saved=JSON.parse(raw)||{};const savedEmp=saved.selectedId?state.empreendimentos.find(e=>String(e.id)===String(saved.selectedId)):null;if(savedEmp){loading(true,'Restaurando seu último contexto…');try{state.selected=savedEmp;await loadContext();enableContextNav();state.view=['dashboard','units','report-context'].includes(saved.view)?saved.view:'dashboard';setActiveNav(state.view);if(state.view==='dashboard')renderDashboard();else if(state.view==='units')renderUnits();else renderContextReport()}finally{loading(false)}}else if(saved.view==='report-global'){await renderGlobalReport()}else{state.selected=null;enableContextNav();await renderHome()}}catch(e){console.warn('Falha ao restaurar o estado da interface.',e);state.selected=null;state.view='home';await renderHome()}}
async function init(){if(!setupSupabase())return;try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await onSignedIn(data.session.user,true);else setLoginVisible(true);sb.auth.onAuthStateChange(async(event,s)=>{if(event==='SIGNED_IN'&&s?.user){await onSignedIn(s.user,true)}else if(event==='SIGNED_OUT'){clearWorkspacePersistence();state.user=null;state.selected=null;state.unidades=[];state.vendas=[];state.owners=[];state._restored=false;setLoginVisible(true)}})}catch(e){console.error(e);showLoginError('Falha de conexão com o Supabase: '+(e.message||e))}}
async function onSignedIn(user,restore=true){if(state.user?.id===user.id&&state._restored)return;state.user=user;setLoginVisible(false);$('userEmail').textContent=user.email||'';$('avatar').textContent=(user.email||'CA').slice(0,2).toUpperCase();state._restored=false;await loadEmpreendimentos();if(restore)await restoreWorkspace();else await renderHome()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').classList.add('hidden');const b=$('loginBtn');b.disabled=true;b.textContent='Entrando…';try{const {error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error}catch(err){console.error(err);showLoginError(err.message||'Não foi possível entrar.')}finally{b.disabled=false;b.textContent='Entrar'}});
$('signOut').onclick=async()=>{await sb.auth.signOut()};
async function loadEmpreendimentos(){const {data,error}=await sb.from('empreendimentos').select('*').order('nome');if(error){toast(error.message,'err');return}state._rawEmpreendimentos=data||[];applyPortfolioData(state._rawEmpreendimentos)}
function icon(type){
  const paths={
    building:'<path d="M4 20V4.8A1.8 1.8 0 0 1 5.8 3H14v17"/><path d="M14 8h4.2A1.8 1.8 0 0 1 20 9.8V20"/><path d="M7.5 6.5h3M7.5 10h3M7.5 13.5h3M16.5 11h1M16.5 14.5h1M3 20h18"/><path d="M10 20v-3h3v3"/>',
    unit:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h2M14 8h2M8 12h2M14 12h2M8 16h2M14 16h2"/>',
    sale:'<path d="M4 6h16v12H4z"/><path d="M7 9h10M7 12h7M7 15h5"/>',
    report:'<path d="M4 19V5M4 19h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
    dashboard:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
    home:'<path d="m4 10 8-6 8 6"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
    money:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M15 10c-.6-1-1.5-1.5-3-1.5-1.7 0-3 .9-3 2s1.2 2 3 2 3 .9 3 2-1.3 2-3 2c-1.5 0-2.5-.5-3-1.5"/>',
    sfh:'<path d="M6 3v18M18 3v18M6 8h12M6 16h12"/><path d="M9 5v3M15 13v3"/>',
    logout:'<path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="M13 8l4 4-4 4M17 12H8"/>'
  };
  const body=paths[type]||paths.report;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}

function enterpriseMetricForHome(e){
  const us=state._allUnits?.[e.id]||[];
  const vs=state._allVendas?.[e.id]||[];
  return {units:us.length,sales:vs.length,latest:String(e.updated_at||e.created_at||'')};
}
function applyPortfolioData(raw){
  // O banco é a única fonte de verdade. Preservamos 1:1 os empreendimentos retornados.
  const source=Array.isArray(raw)?raw:[];
  state.empreendimentos=[...source].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
  if(state.selected && !state.empreendimentos.some(e=>String(e.id)===String(state.selected.id))){
    state.selected=null;state.unidades=[];state.vendas=[];state.owners=[];
  }
}
function activeEnterpriseIds(){
  return new Set((state.empreendimentos||[]).map(e=>String(e.id)));
}

function enableContextNav(){document.querySelectorAll('#contextNav button').forEach(b=>b.disabled=!state.selected);$('contextCard').classList.toggle('hidden',!state.selected);$('contextName').textContent=state.selected?.nome||''}
function setActiveNav(view){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const labels={home:'Todos os empreendimentos','report-global':'Relatório executivo','new-emp':'Novo empreendimento',dashboard:state.selected?.nome||'Dashboard',units:'Unidades', 'report-context':'Relatórios'};$('crumb').textContent=labels[view]||'CASA ALTA'}
function renderSelector(){state.selected=null;state.view='home';enableContextNav();setActiveNav('home');renderHome()}
function goHome(){state.selected=null;state.unidades=[];state.vendas=[];state.owners=[];state.contextFilters={q:'',tipo:'',sfh:'',anoVenda:'',minValor:'',maxValor:''};enableContextNav();setActiveNav('home');state.view='home';persistWorkspace();renderHome()}
async function selectEmp(id){
  const emp=state.empreendimentos.find(x=>String(x.id)===String(id));
  if(!emp)return;
  loading(true,'Abrindo empreendimento…');
  state.selected=emp;
  state.contextFilters={q:'',tipo:'',sfh:'',anoVenda:'',minValor:'',maxValor:'',status:''};
  try{
    await loadContext();
    enableContextNav();
    setActiveNav('units');
    state.view='units';
    persistWorkspace();
    renderUnits();
  }catch(err){
    enableContextNav();setActiveNav('home');state.view='home';persistWorkspace();await renderHome();
  }finally{loading(false)}
}

async function fetchAllRows(table, buildQuery){
  const pageSize=500;
  let from=0;
  const rows=[];
  while(true){
    let q=buildQuery(sb.from(table).select('*')).range(from,from+pageSize-1);
    const {data,error}=await q;
    if(error) throw error;
    const batch=data||[];
    rows.push(...batch);
    if(batch.length<pageSize) break;
    from+=pageSize;
  }
  return rows;
}
function normalizeUnit(u){
  return {
    ...u,
    id:u.id,
    empreendimento_id:u.empreendimento_id,
    codigo:String(u.codigo ?? u.unidade ?? u.ap ?? u.apartamento ?? u.unit ?? '').trim(),
    bloco:String(u.bloco ?? u.bl ?? u.block ?? '').trim(),
    andar:String(u.andar ?? u.pavimento ?? '').trim(),
    tipologia:String(u.tipologia ?? u.tipo_unidade ?? '').trim(),
    status:String(u.status ?? u.status_unidade ?? 'Cadastrada').trim() || 'Cadastrada'
  };
}
function dedupeUnits(rows){
  const map=new Map();
  for(const u of rows||[]){
    const key=`${norm(u.empreendimento_id)}|${norm(u.bloco)}|${norm(u.codigo)}`;
    const old=map.get(key);
    if(!old || String(u.updated_at||u.created_at||'')>String(old.updated_at||old.created_at||'')) map.set(key,u);
  }
  return [...map.values()].sort((a,b)=>String(a.bloco||'').localeCompare(String(b.bloco||''),'pt-BR',{numeric:true})||String(a.codigo||'').localeCompare(String(b.codigo||''),'pt-BR',{numeric:true}));
}
function dedupeSales(rows){
  const map=new Map();
  for(const v of (rows||[])){
    if(!v?.unidade_id) continue;
    const key=String(v.unidade_id);
    const old=map.get(key);
    if(!old || String(v.updated_at||v.created_at||'')>String(old.updated_at||old.created_at||'')) map.set(key,v);
  }
  return [...map.values()];
}
function empSales(id){
  const unitIds=new Set((state._allUnits[id]||[]).map(u=>String(u.id)));
  return dedupeSales((state._allVendas[id]||[]).filter(v=>unitIds.has(String(v.unidade_id))));
}
function empMetrics(id){
  const us=state._allUnits[id]||[],vs=empSales(id),fin=financeSummary(vs);
  return {u:us.length,v:new Set(vs.map(v=>String(v.unidade_id))).size,sfh:vs.filter(v=>norm(v.tipo_venda)==='sfh contratado').length,sfhPending:vs.filter(v=>norm(v.tipo_venda)==='sfh por contratar').length,vgv:fin.sale,avg:fin.avg,valuedCount:fin.valuedCount};
}
function currentPortfolioSales(){
  const ids=activeEnterpriseIds(),rows=[];
  for(const [empId,arr] of Object.entries(state._allVendas||{})){
    if(!ids.has(String(empId))) continue;
    const unitIds=new Set((state._allUnits[empId]||[]).map(u=>String(u.id)));
    for(const v of dedupeSales((arr||[]).filter(x=>x?.id && unitIds.has(String(x.unidade_id))))){
      rows.push({...v,empId:String(empId)});
    }
  }
  return rows;
}
function entityLookup(row){
  const e=state.empreendimentos.find(x=>String(x.id)===String(row.empId));
  const u=(state._allUnits[row.empId]||[]).find(x=>String(x.id)===String(row.unidade_id));
  const p=state._allOwners[row.proprietario_id];
  return {e,u,p};
}
function filteredGlobal(){
  const all=currentPortfolioSales(),f=state.globalFilters||{};
  let rows=all;
  if(f.emp) rows=rows.filter(v=>String(v.empId)===String(f.emp));
  if(f.tipo) rows=rows.filter(v=>norm(v.tipo_venda)===norm(f.tipo));
  if(f.anoVenda) rows=rows.filter(v=>String(v.data_venda||'').startsWith(f.anoVenda));
  if(f.sfh==='com') rows=rows.filter(v=>!!v.data_sfh);
  if(f.sfh==='sem') rows=rows.filter(v=>!v.data_sfh);
  if(f.minValor!=='') rows=rows.filter(v=>Number.isFinite(Number(v.valor_venda)) && Number(v.valor_venda)>=Number(f.minValor));
  if(f.maxValor!=='') rows=rows.filter(v=>Number.isFinite(Number(v.valor_venda)) && Number(v.valor_venda)<=Number(f.maxValor));
  if(f.q){
    const q=norm(f.q);rows=rows.filter(v=>{const {e,u,p}=entityLookup(v);return norm(`${e?.nome||''} ${u?.codigo||''} ${u?.bloco||''} ${p?.nome||''}`).includes(q)});
  }
  return rows;
}
function reportTypeRows(rows){
  const map={};rows.forEach(v=>{const k=v.tipo_venda||'Não informado';map[k]=(map[k]||0)+1});
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function reportValueByType(rows){
  const map={};rows.forEach(v=>{const k=v.tipo_venda||'Não informado';map[k]=(map[k]||0)+(Number(v.valor_venda)||0)});
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function reportValueByYear(rows){
  const map={};rows.forEach(v=>{if(!v.data_venda)return;const y=String(v.data_venda).slice(0,4);map[y]=(map[y]||0)+(Number(v.valor_venda)||0)});
  return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
}
function reportSfhByYear(rows){
  const map={};rows.forEach(v=>{if(!v.data_sfh)return;const y=String(v.data_sfh).slice(0,4);map[y]=(map[y]||0)+1});
  return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
}

async function loadContext(){
  const e=state.selected;
  state.unidades=[];state.vendas=[];state.owners=[];
  try{
    // A tabela de UNIDADES é a fonte principal da aba. Ela é lida em páginas para garantir cobertura completa.
    let units=await fetchAllRows('unidades',q=>q.eq('empreendimento_id',e.id).order('bloco',{ascending:true}).order('codigo',{ascending:true}));
    if(!units.length){
      // Fallback para instalações antigas em que o relacionamento pode estar inconsistente.
      const allUnits=await fetchAllRows('unidades',q=>q.order('bloco',{ascending:true}).order('codigo',{ascending:true}));
      units=allUnits.filter(x=>String(x.empreendimento_id)===String(e.id));
    }
    state.unidades=(units||[]).map(normalizeUnit);

    // As vendas são complementares: se houver problema de permissão em vendas, ainda mostramos TODAS as unidades.
    try{ state.vendas=dedupeSales(await fetchAllRows('vendas',q=>q.eq('empreendimento_id',e.id).order('created_at',{ascending:true}))); }
    catch(saleErr){ state.vendas=[]; toast(`Unidades carregadas; não foi possível ler vendas: ${saleErr?.message||saleErr}`,'err'); }

    try{ state.owners=await fetchAllRows('proprietarios',q=>q.order('nome',{ascending:true})); }
    catch(ownerErr){ state.owners=[]; toast(`Unidades carregadas; não foi possível ler proprietários: ${ownerErr?.message||ownerErr}`,'err'); }

    if(!state.unidades.length){
      const detail='Nenhuma unidade encontrada em public.unidades para o empreendimento selecionado. Verifique empreendimento_id, RLS e a tabela public.unidades.';
      toast(detail,'err');
    } else {
      toast(`${state.unidades.length} unidade(s) carregada(s) do Supabase para ${e.nome}.`,'ok');
    }
  }catch(err){
    state.unidades=[];
    state.vendas=[];
    state.owners=[];
    const detail=err?.message||err?.details||err?.hint||'Erro desconhecido ao consultar o Supabase.';
    toast(`Erro ao carregar unidades: ${detail}`,'err');
    throw err;
  }
}
async function v4LoadAllData(){

}

  }).filter(x=>{
    const hay=norm(`${x.codigo||''} ${x.bloco||''} ${x.andar||''} ${x.p.nome||''} ${x.p.documento||''} ${x.v.tipo_venda||''} ${x.comercialStatus||''}`);
    if(q && !hay.includes(q)) return false;
    if(tipo && norm(x.v.tipo_venda||'')!==tipo) return false;
    if(status && norm(x.comercialStatus||'')!==status) return false;
    if(sfh==='com' && !x.v.data_sfh) return false;
    if(sfh==='sem' && x.v.data_sfh) return false;
    if(anoVenda && !String(x.v.data_venda||'').startsWith(anoVenda)) return false;
    if(minValor!==null && (Number(x.v.valor_venda)||0)<minValor) return false;
    if(maxValor!==null && (Number(x.v.valor_venda)||0)>maxValor) return false;
    return true;
  }).sort((a,b)=>String(a.bloco||'').localeCompare(String(b.bloco||''),'pt-BR',{numeric:true,sensitivity:'base'})||String(a.codigo||'').localeCompare(String(b.codigo||''),'pt-BR',{numeric:true,sensitivity:'base'}));
  return result;
}

async function deleteUnit(id){if(!confirm('Excluir esta unidade e a venda vinculada?'))return;loading(true,'Excluindo cadastro…');try{const {error}=await sb.from('unidades').delete().eq('id',id);if(error)throw error;state.allLoaded=false;await loadContext();toast('Cadastro excluído.','ok');closeModal();renderUnits()}catch(err){toast(err.message||'Não foi possível excluir.','err')}finally{loading(false)}}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function exportRows(rows,filename){const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
function exportPortfolio(){const rows=portfolioRows().map(({e,m})=>[e.nome,e.cidade||'',e.status||'',m.u,m.v,m.vgv,m.sfh,m.sfhPending]);exportRows([['Empreendimento','Cidade','Status','Unidades','Unidades vendidas','VGV','SFH contratado','SFH por contratar'],...rows],'portfolio_empreendimentos_v8.csv')}
function exportGlobalReport(){
  const rows=filteredGlobal().map(v=>{const {e,u,p}=entityLookup(v);return[e?.nome||'',u?.bloco||'',u?.codigo||'',p?.nome||'',v.tipo_venda||'',v.data_venda||'',v.valor_venda??'',v.recursos_proprios??'',v.financiamento??'',v.fgts??'',v.subsidio??'',v.data_sfh||'',v.link_doc||'',v.observacoes||'']});
  exportRows([['Empreendimento','Bloco','Unidade','Cliente','Tipo de venda','Data da venda','Valor de venda','Recursos Próprios','Financiamento','FGTS','Subsídio','Data SFH','Link Doc.','Obs'],...rows],'relatorio_executivo_v8.csv');
}
function exportContext(){
  const vendaByUnit={};(state.vendas||[]).forEach(v=>{if(v?.unidade_id!=null)vendaByUnit[String(v.unidade_id)]=v});
  const ownerById={};(state.owners||[]).forEach(p=>ownerById[String(p.id)]=p);
  const rows=(state.unidades||[]).map(u=>{const v=vendaByUnit[String(u.id)]||{},p=ownerById[String(v.proprietario_id)]||{};return[state.selected.nome,u?.bloco||'',u?.codigo||'',p?.nome||'',v.tipo_venda||'',v.data_venda||'',v.valor_venda??'',v.recursos_proprios??'',v.financiamento??'',v.fgts??'',v.subsidio??'',v.data_sfh||'',v.link_doc||'',v.observacoes||'']});
  exportRows([['Empreendimento','Bloco','Unidade','Cliente','Tipo de venda','Data da venda','Valor de venda','Recursos Próprios','Financiamento','FGTS','Subsídio','Data SFH','Link Doc.','Obs'],...rows],'empreendimento_'+norm(state.selected.nome).replace(/\s+/g,'_')+'_v8.csv');
}
function toggleSidebar(force){
  const mobile=window.innerWidth<=820;
  if(mobile){
    const open=document.querySelector('.sidebar')?.classList.contains('open');
    const next=typeof force==='boolean'?force:!open;
    document.querySelector('.sidebar')?.classList.toggle('open',next);$('mobileBackdrop')?.classList.toggle('hidden',!next);return;
  }
  const collapsed=document.body.classList.contains('nav-collapsed');
  const next=typeof force==='boolean'?force:!collapsed;document.body.classList.toggle('nav-collapsed',next);
  try{localStorage.setItem('casaalta:sidebar:v1',next?'1':'0')}catch(e){}
}
function restoreSidebar(){try{if(localStorage.getItem('casaalta:sidebar:v1')==='1')document.body.classList.add('nav-collapsed')}catch(e){}}
window.addEventListener('resize',()=>{if(window.innerWidth>820){document.querySelector('.sidebar')?.classList.remove('open');$('mobileBackdrop')?.classList.add('hidden')}});
async function navigate(view){if(window.innerWidth<=820)toggleSidebar(false);if(view==='home'){goHome();return}if(view==='new-emp'){setActiveNav(view);state.view=view;persistWorkspace();openEmpModal();return}if(view==='report-global'){state.view=view;persistWorkspace();await renderGlobalReport();return}if(!state.selected){toast('Selecione um empreendimento para acessar esta área.','err');renderSelector();return}state.view=view;persistWorkspace(); if(view==='dashboard')renderDashboard(); if(view==='units')renderUnits(); if(view==='report-context')renderContextReport()}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistWorkspace()});
window.addEventListener('beforeunload',persistWorkspace);
document.addEventListener('DOMContentLoaded',()=>{restoreSidebar();init()});
</script>
</body></html>
